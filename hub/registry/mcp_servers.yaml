{
  "schema_version": 1,
  "mcp_servers": [
    {
      "id": "filesystem",
      "name": "Filesystem MCP",
      "description": "Read/write project files within configured roots.",
      "transport": "stdio",
      "command": "npx",
      "args": ["-y", "@modelcontextprotocol/server-filesystem", "${PROJECT_ROOT}"],
      "env": {},
      "enabled": true,
      "permission_level": "medium",
      "cost_level": "free",
      "allowed_paths": ["${PROJECT_ROOT}"],
      "forbidden_paths": [".git", ".env", ".opcoding-tools", "node_modules"],
      "requires_confirmation": ["write outside project root"],
      "notes": "Read-only profile preferred until a workflow explicitly needs writes."
    },
    {
      "id": "git",
      "name": "Git MCP",
      "description": "Local git status, diff, log, and blame.",
      "transport": "stdio",
      "command": "git",
      "args": ["status"],
      "env": {},
      "enabled": true,
      "permission_level": "medium",
      "cost_level": "free",
      "allowed_paths": ["${PROJECT_ROOT}"],
      "forbidden_paths": [],
      "requires_confirmation": ["push", "merge", "rebase", "branch delete", "tag"],
      "notes": "Prefer OPcoding GitOps helpers for safety."
    },
    {
      "id": "github",
      "name": "GitHub MCP",
      "description": "GitHub issues, PRs, checks, and repository metadata.",
      "transport": "http",
      "command": "",
      "args": [],
      "env": {"GITHUB_TOKEN": "optional"},
      "enabled": false,
      "permission_level": "medium-high",
      "cost_level": "free-api-limits",
      "allowed_paths": [],
      "forbidden_paths": [],
      "requires_confirmation": ["write comments", "push", "merge", "close issue"],
      "notes": "Read-only by default; enable per project."
    },
    {
      "id": "shell-terminal",
      "name": "Shell/Terminal MCP",
      "description": "Run local shell commands.",
      "transport": "stdio",
      "command": "powershell",
      "args": ["-NoProfile"],
      "env": {},
      "enabled": false,
      "permission_level": "high",
      "cost_level": "free",
      "allowed_paths": ["${PROJECT_ROOT}"],
      "forbidden_paths": ["system directories", "home secrets"],
      "requires_confirmation": ["destructive commands", "network install", "deploy"],
      "notes": "Use allowlists; disabled by default."
    },
    {
      "id": "memory",
      "name": "Local Memory MCP",
      "description": "Project-scoped summaries, decisions, and task history.",
      "transport": "stdio",
      "command": "python",
      "args": ["-m", "opcoding", "memory", "${PROJECT_ROOT}", "list"],
      "env": {},
      "enabled": true,
      "permission_level": "medium",
      "cost_level": "free",
      "allowed_paths": ["${PROJECT_ROOT}/.opcoding/memory"],
      "forbidden_paths": [".env"],
      "requires_confirmation": [],
      "notes": "Redact secrets before storing."
    },
    {
      "id": "browser",
      "name": "Browser MCP",
      "description": "Localhost and safe website inspection.",
      "transport": "stdio",
      "command": "npx",
      "args": ["playwright", "test"],
      "env": {},
      "enabled": false,
      "permission_level": "medium",
      "cost_level": "free",
      "allowed_paths": ["${PROJECT_ROOT}"],
      "forbidden_paths": [],
      "requires_confirmation": ["external login", "non-local browsing"],
      "notes": "Prefer localhost first."
    },
    {
      "id": "web-search",
      "name": "Web Search MCP",
      "description": "Read-only web research with citations.",
      "transport": "remote",
      "command": "",
      "args": [],
      "env": {},
      "enabled": false,
      "permission_level": "medium",
      "cost_level": "free-or-metered",
      "allowed_paths": [],
      "forbidden_paths": [],
      "requires_confirmation": ["paid API", "posting data"],
      "notes": "Use only for current/unstable facts or explicit research."
    },
    {
      "id": "docs",
      "name": "Docs MCP",
      "description": "Official documentation lookup and local docs cache.",
      "transport": "stdio-or-http",
      "command": "",
      "args": [],
      "env": {},
      "enabled": false,
      "permission_level": "low",
      "cost_level": "free",
      "allowed_paths": ["${PROJECT_ROOT}/docs"],
      "forbidden_paths": [],
      "requires_confirmation": [],
      "notes": "Prefer official docs and cached snippets."
    },
    {
      "id": "database",
      "name": "Generic Database MCP",
      "description": "Database schema/query access.",
      "transport": "stdio",
      "command": "",
      "args": [],
      "env": ["DATABASE_URL"],
      "enabled": false,
      "permission_level": "high",
      "cost_level": "free-or-cloud",
      "allowed_paths": [],
      "forbidden_paths": ["production database"],
      "requires_confirmation": ["write query", "production connection"],
      "notes": "Read-only local/dev DB only by default."
    },
    {
      "id": "sqlite",
      "name": "SQLite MCP",
      "description": "Local SQLite query and schema access.",
      "transport": "stdio",
      "command": "python",
      "args": ["-c", "import sqlite3"],
      "env": {},
      "enabled": true,
      "permission_level": "medium",
      "cost_level": "free",
      "allowed_paths": ["${PROJECT_ROOT}"],
      "forbidden_paths": [],
      "requires_confirmation": ["write query"],
      "notes": "Safe for project-local files."
    },
    {
      "id": "postgres",
      "name": "Postgres MCP",
      "description": "PostgreSQL query and schema access.",
      "transport": "stdio",
      "command": "",
      "args": [],
      "env": ["POSTGRES_URL"],
      "enabled": false,
      "permission_level": "high",
      "cost_level": "free-or-cloud",
      "allowed_paths": [],
      "forbidden_paths": ["production database"],
      "requires_confirmation": ["write query", "non-local host"],
      "notes": "Disabled until project profile opts in."
    },
    {
      "id": "testing",
      "name": "Testing MCP",
      "description": "Run targeted project tests and parse failures.",
      "transport": "stdio",
      "command": "python",
      "args": ["-m", "opcoding", "test", "${PROJECT_ROOT}", "--dry-run"],
      "env": {},
      "enabled": true,
      "permission_level": "medium",
      "cost_level": "free",
      "allowed_paths": ["${PROJECT_ROOT}"],
      "forbidden_paths": [],
      "requires_confirmation": ["full test suite over threshold"],
      "notes": "Targeted tests before full tests."
    },
    {
      "id": "package-lookup",
      "name": "Package Lookup MCP",
      "description": "Package metadata, versions, and advisories.",
      "transport": "stdio-or-http",
      "command": "",
      "args": [],
      "env": {},
      "enabled": false,
      "permission_level": "medium",
      "cost_level": "free-network",
      "allowed_paths": [],
      "forbidden_paths": [],
      "requires_confirmation": ["network audit"],
      "notes": "Cache registry results."
    },
    {
      "id": "playwright",
      "name": "Playwright MCP",
      "description": "Browser automation for UI tests and screenshots.",
      "transport": "stdio",
      "command": "npx",
      "args": ["playwright", "test"],
      "env": {},
      "enabled": false,
      "permission_level": "medium",
      "cost_level": "free",
      "allowed_paths": ["${PROJECT_ROOT}"],
      "forbidden_paths": [],
      "requires_confirmation": ["external domains", "credential entry"],
      "notes": "Optional heavy dependency."
    },
    {
      "id": "docker",
      "name": "Docker MCP",
      "description": "Container build/run/deploy helpers.",
      "transport": "stdio",
      "command": "docker",
      "args": ["version"],
      "env": {},
      "enabled": false,
      "permission_level": "high",
      "cost_level": "free-local",
      "allowed_paths": ["${PROJECT_ROOT}"],
      "forbidden_paths": [],
      "requires_confirmation": ["volume delete", "compose down -v", "push image"],
      "notes": "Disabled by default because containers can mutate system state."
    },
    {
      "id": "local-models",
      "name": "Local Models MCP",
      "description": "Optional local model server bridge.",
      "transport": "http-or-stdio",
      "command": "",
      "args": [],
      "env": ["LOCAL_MODEL_URL"],
      "enabled": false,
      "permission_level": "medium",
      "cost_level": "free-local-compute",
      "allowed_paths": [],
      "forbidden_paths": [],
      "requires_confirmation": ["model download"],
      "notes": "Phase 2 integration target."
    }
  ]
}
