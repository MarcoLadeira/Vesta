# Reusable guarded-workflow templates (issue #39). Each conforms to the
# guarded-workflow contract: path locks, evidence artifacts, stop conditions,
# permission boundaries, and fail-closed risky actions.
schema_version: 1
reference_implementation: mobile_readiness
templates:
  - id: mobile_readiness
    title: Mobile Readiness (reference implementation)
    trigger: Prepare a mobile app for store submission
    permission_boundaries: read project; write evidence and bounded fixes only; no submit
    path_locks:
      allowed_write: [".opaihub/evidence", "android", "ios", "lib", "test"]
      forbidden: [".git", ".env", "**/secrets/**", "*.keystore", "*.p12"]
    evidence_artifacts: [readiness-scorecard.json, audit-log.json, signed-evidence-packet.json]
    stop_conditions:
      - Unsigned or expired evidence
      - Failing platform compliance gate
      - Missing privacy or permission declarations
    fail_closed: [app store submit, git push, release publish]
    cost_policy: L0/L1 local audits before any model escalation
  - id: release_preflight
    title: Release Preflight
    trigger: Before tagging or publishing a release
    permission_boundaries: read project; run local checks; no tag/publish without approval
    path_locks:
      allowed_write: [".opaihub/evidence"]
      forbidden: [".git", ".env", "**/secrets/**"]
    evidence_artifacts: [preflight-report.json, changelog-draft.md]
    stop_conditions: [Version mismatch, Failing smoke install, Dirty working tree]
    fail_closed: [git push, release publish, npm publish]
    cost_policy: deterministic checks before model use
  - id: ci_fixer
    title: CI Fixer
    trigger: CI is red and needs a bounded fix
    permission_boundaries: read logs and diff; propose patch; no force-push
    path_locks:
      allowed_write: ["src", "lib", "test", "tests", ".opaihub/evidence"]
      forbidden: [".git", ".env", "**/secrets/**", ".github/workflows"]
    evidence_artifacts: [failure-analysis.json, patch-plan.json]
    stop_conditions: [No reproducible failure, Fix requires forbidden path]
    fail_closed: [git push --force]
    cost_policy: collect failing logs before model escalation
  - id: pr_review
    title: PR Review
    trigger: Before requesting or approving a PR
    permission_boundaries: read-only review; no merge without approval
    path_locks:
      allowed_write: [".opaihub/evidence"]
      forbidden: [".git", ".env", "**/secrets/**"]
    evidence_artifacts: [review-notes.json, secret-scan.json]
    stop_conditions: [Secret detected, Missing test evidence]
    fail_closed: [git push, merge]
    cost_policy: static checks before model review
  - id: security_audit
    title: Security Audit
    trigger: Audit dependencies and secrets
    permission_boundaries: read-only scanning; no auto-remediation of secrets
    path_locks:
      allowed_write: [".opaihub/evidence"]
      forbidden: [".git", ".env", "**/secrets/**"]
    evidence_artifacts: [secret-scan.json, dependency-audit.json]
    stop_conditions: [Secret-scan fails closed on findings]
    fail_closed: [deploy, release publish]
    cost_policy: local scanners before any model summary
  - id: dependency_update
    title: Dependency Update
    trigger: Update dependencies safely
    permission_boundaries: read manifests; propose bounded version bumps; no publish
    path_locks:
      allowed_write: ["package.json", "requirements.txt", "Cargo.toml", "go.mod", ".opaihub/evidence"]
      forbidden: [".git", ".env", "**/secrets/**"]
    evidence_artifacts: [update-plan.json, test-evidence.json]
    stop_conditions: [Breaking change without tests, Lockfile conflict]
    fail_closed: [npm publish, git push]
    cost_policy: run tests locally before model review
