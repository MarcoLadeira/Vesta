schema_version: 1
deny:
  # download + execute — original and pipe-spacing bypass forms
  - "curl * | sh"
  - "curl * | bash"
  - "curl * | zsh"
  - "curl * | fish"
  - "wget * | sh"
  - "wget * | bash"
  # PowerShell download + execute
  - "invoke-webrequest * | iex"
  - "iwr * | iex"
  - "iex *"
  - "invoke-expression *"
  # chmod world-writable
  - "chmod -r 777"
  - "chmod 777 -r"
  - "chmod -r 0777"
  # cmd.exe wrappers for destructive ops
  - "cmd /c rmdir*"
  - "cmd /c del *"
  - "cmd.exe /c rmdir*"
  - "cmd.exe /c del *"
confirm:
  - "git push"
  - "git commit"
  - "git merge"
  - "git rebase"
  - "git reset --hard"
  - "git clean -f*"
  - "git branch -d *"
  - "git branch -D"
  # GitHub CLI mutations: closing/commenting/merging changes shared remote
  # state and must never run without explicit confirmation (F23).
  - "gh issue close"
  - "gh issue comment"
  - "gh issue create"
  - "gh issue delete"
  - "gh issue edit"
  - "gh issue reopen"
  - "gh pr close"
  - "gh pr comment"
  - "gh pr create"
  - "gh pr edit"
  - "gh pr merge"
  - "gh pr review"
  - "gh release create"
  - "gh release delete"
  - "gh release edit"
  - "gh api"
  - "gh repo archive"
  - "gh repo delete"
  - "Remove-Item -Recurse"
  - "rm -rf"
  - "rm -fr"
  - "rm -r"
  - "rm --recursive*"
  - "docker system prune"
  - "docker compose down -v"
  - "npm publish"
  - "twine upload"
  - "terraform apply"
  - "kubectl delete"
  - "vercel --prod"
  - "wrangler deploy"
safe_examples:
  - "git status --short --branch"
  - "python -m unittest discover -s tests"
  - "python -m opcoding tools . run ruff"
