# OPai open-core edition boundaries (issue #38).
# These are honest config-level boundaries, not billing. There is no license
# server in alpha; the active edition is self-declared (OPAI_EDITION env or
# project state). Free always retains meaningful local value, and no paid
# feature depends on telemetry leaving the machine.
schema_version: 1
default_edition: free
currency: USD
editions:
  free:
    label: Free
    price: 0
    price_unit: forever
    tagline: Local-first AI coding cost firewall for individuals.
  pro:
    label: Pro
    price: 12
    price_unit: per month
    price_annual: 99
    price_annual_unit: per year
    tagline: Deeper savings proof, exports, and balanced/team policy profiles.
  team:
    label: Team
    price: 19
    price_unit: per user / month
    tagline: Shared policy, pooled budgets, team reports, and private registries.
  team-governance:
    label: Team Governance
    price: 29
    price_unit: per user / month
    tagline: Audit logs, approved MCP profiles, CI policy gates, and evidence exports.
  enterprise:
    label: Enterprise
    price: custom
    price_unit: contact
    tagline: SSO/RBAC, self-host, signed registries, signed evidence, and security review.
# Each feature names the lowest edition that includes it.
features:
  - id: local_first_routing
    min_edition: free
    description: Local-first cost-aware routing and evidence collection.
  - id: usage_ledger
    min_edition: free
    description: Local privacy-safe usage ledger.
  - id: savings_report
    min_edition: free
    description: Per-project savings report (opai savings).
  - id: client_activation
    min_edition: free
    description: Activation across Claude, Codex, Copilot, Cursor, and Cline.
  - id: policy_profiles_solo
    min_edition: free
    description: solo-cheap and solo-balanced policy profiles.
  - id: guarded_workflows_core
    min_edition: free
    description: Guarded-workflow contract and fail-closed gates.
  - id: savings_export
    min_edition: pro
    description: Export shareable savings reports (markdown/json).
  - id: policy_profile_team_safe
    min_edition: pro
    description: team-safe policy profile with evidence requirements.
  - id: model_eval_history
    min_edition: pro
    description: Retained model-eval scorecard history.
  - id: shared_policy
    min_edition: team
    description: Committed team policy distribution (opai team apply).
  - id: team_report
    min_edition: team
    description: Team governance rollup (opai team report).
  - id: private_registry
    min_edition: team
    description: Private tool/agent/workflow/MCP registries.
  - id: audit_logs
    min_edition: team-governance
    description: Tamper-evident audit trail and exports (opai audit).
  - id: approved_mcp_profiles
    min_edition: team-governance
    description: Enforced allowlist of approved MCP servers.
  - id: ci_policy_gates
    min_edition: team-governance
    description: Fail-closed CI policy check (opai policy check).
  - id: evidence_exports
    min_edition: team-governance
    description: Signed guarded-workflow evidence exports.
  - id: policy_profile_enterprise_strict
    min_edition: enterprise
    description: enterprise-strict profile and fail-closed paid blocking.
  - id: signed_evidence
    min_edition: enterprise
    description: Signed evidence packets and registry verification.
  - id: sso_rbac
    min_edition: enterprise
    description: SSO/RBAC and role-based governance (planned hosted mode).
  - id: self_host
    min_edition: enterprise
    description: Self-hosted/private deployment and support.
  - id: signed_workflow_packs
    min_edition: enterprise
    description: Signed internal workflow packs and marketplace trust.
