      "id": "opai-cli",
      "name": "OPai CLI",
      "category": "automation",
      "description": "Branded 0.1.0 pre-alpha CLI for one-command local OPai installation, hub access, dashboards, and low-cost workflow entry points.",
      "status": "installed",
      "type": "local",
      "cost_level": "free",
      "permission_level": "low",
      "local_first": true,
      "open_source": false,
      "requires_api_key": false,
      "env_vars": [],
      "install_command": "pip install -e .",
      "run_command": "python -m opai --help",
      "health_check": {
        "command": "python -m opai --help"
      },
      "inputs": [
        "project path",
        "hub command"
      ],
      "outputs": [
        "install manifest",
        "registry views",
        "dashboard paths"
      ],
      "tags": [
        "opai",
        "installer",
        "hub",
        "local-first"
      ],
      "docs_url": "hub/docs/INSTALL.md",
      "notes": "Public brand wrapper over OP AI Hub; defaults do not install cloud tools or spend credits.",
      "enabled_by_default": true
    },
