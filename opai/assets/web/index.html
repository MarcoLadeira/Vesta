<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Defense in depth (#149): this page is local-only; its data arrives over
       the QWebChannel bridge. No connect-src means fetch/XHR/WebSocket are
       blocked entirely, so rendered model output cannot exfiltrate anything. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: qrc:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPai</title>
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="app-header" id="appHeader">
      <div class="header-leading">
        <button class="topbar-icon sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="true" title="Toggle sidebar">
          <span class="tb-icon" data-icon="menu" aria-hidden="true"></span>
        </button>
        <div class="header-brand" aria-label="OPai">
          <span class="header-logo"><img src="../opai-icon.png" alt="OPai" /></span>
          <span class="header-brand-name">OPai</span>
          <span class="header-on-dot" id="brandDot" aria-hidden="true"></span>
        </div>
        <span class="header-divider" aria-hidden="true"></span>
        <div class="ws-switch-wrap">
          <button class="ws-switch" id="wsSwitch" aria-label="Switch project folder" aria-haspopup="true" aria-expanded="false" title="Switch project folder">
            <span class="ws-ico" data-icon="workspace" aria-hidden="true"></span>
            <span class="ws-copy">
              <span id="wsLabel">…</span>
              <span class="ws-context" id="wsContext">Local workspace</span>
            </span>
            <span class="chev" data-icon="chevronDown" aria-hidden="true"></span>
          </button>
          <div class="ws-menu" id="wsMenu" role="menu"></div>
        </div>
      </div>

      <div class="header-drag-space" aria-hidden="true"></div>

      <div class="header-actions">
        <div class="status-line" id="statusLine"></div>
        <button class="topbar-action" id="headerNewChat" aria-label="New chat" title="New chat">
          <span class="action-icon" data-icon="plus" aria-hidden="true"></span><span class="action-label">New chat</span>
        </button>
        <button class="topbar-icon" id="headerSettings" aria-label="Settings" title="Settings">
          <span class="tb-icon" data-icon="settings" aria-hidden="true"></span>
        </button>
        <button class="topbar-icon inspector-toggle on" id="panelToggle" aria-label="Inspector" aria-pressed="true" title="Inspector">
          <span class="tb-icon" data-icon="panel" aria-hidden="true"></span>
        </button>
        <div class="window-controls" id="windowControls" aria-label="Window controls">
          <button class="window-control" id="windowMinimize" aria-label="Minimize" title="Minimize"><span class="wc-icon" data-icon="minimize" aria-hidden="true"></span></button>
          <button class="window-control" id="windowMaximize" aria-label="Maximize or restore" title="Maximize or restore"><span class="wc-icon" data-icon="maximize" aria-hidden="true"></span></button>
          <button class="window-control close" id="windowClose" aria-label="Close" title="Close"><span class="wc-icon" data-icon="close" aria-hidden="true"></span></button>
        </div>
      </div>
    </header>

    <!-- sidebar -->
    <aside class="sidebar">
      <button class="new-chat" id="newChat"><span data-icon="plus" aria-hidden="true"></span> New chat</button>
      <button class="new-chat new-app" id="newApp"><span data-icon="sparkles" aria-hidden="true"></span> New app</button>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="update-shell" id="updateShell" role="status" aria-live="polite" hidden>
          <button class="update-control" id="updateBanner" type="button" aria-expanded="false" aria-controls="updateSheet">
            <span class="update-dot" aria-hidden="true"></span>
            <span class="update-control-copy" id="updateBannerText">Update available</span>
            <span aria-hidden="true">›</span>
          </button>
          <section class="update-sheet" id="updateSheet" aria-label="OPai update" aria-live="polite" hidden>
            <div class="update-sheet-head">
              <strong id="updateSheetTitle">OPai update</strong>
              <button class="update-sheet-close" id="updateSheetClose" type="button" aria-label="Close update details">×</button>
            </div>
            <p id="updateSheetDescription"></p>
            <dl class="update-sheet-meta" id="updateSheetMeta"></dl>
            <div class="update-progress" id="updateProgress" role="progressbar" aria-label="Update download progress" hidden><span></span></div>
            <div class="update-release-notes" id="updateReleaseNotes"></div>
            <div class="update-sheet-actions" id="updateSheetActions"></div>
          </section>
        </div>
        <button class="foot-settings" id="footSettings" aria-label="Settings"><span class="foot-icon" data-icon="settings" aria-hidden="true"></span> <span>Settings</span></button>
        <div class="acct" id="acct"></div>
        <div class="priv-foot">Local only · no telemetry</div>
      </div>
    </aside>

    <!-- main -->
    <main class="main">
      <div class="view-wrap" id="viewWrap">
        <!-- chat -->
        <section class="view active" id="view-chat">
          <div class="status-strip" id="statusStrip" role="status" aria-live="polite" hidden>
            <span class="ss-dot" id="ssDot" aria-hidden="true"></span>
            <span class="ss-conn" id="ssConn">Connecting…</span>
            <span class="ss-model" id="ssModel"></span>
            <span class="ss-spacer"></span>
            <span class="ss-cost" id="ssCost"></span>
            <span class="ss-time" id="ssTime" aria-hidden="true">00:00</span>
          </div>
          <div class="scroll" id="chatScroll">
            <div class="thread" id="thread">
              <div class="empty" id="empty">
                <div class="empty-mark" aria-hidden="true"><img src="../opai-mascot.png" alt="OPai" /></div>
                <h1>Better. Faster. Cheaper.</h1>
                <p id="emptySub" hidden></p>
                <div class="chips" id="chips"></div>
              </div>
            </div>
          </div>
          <div class="composer-wrap">
            <button class="jump-latest" id="jumpLatest" type="button" aria-label="Jump to latest response" hidden>
              <span aria-hidden="true">↓</span> Jump to latest
            </button>
            <!-- Composer Redesign: one card, three switchable directions
                 (toolbar / single / command) chosen in Settings › Appearance.
                 The textarea is the product; everything else is a quiet
                 accessory revealed on demand. The native <select>/inputs below
                 stay in the DOM (visually hidden) so the existing send, routing,
                 mode, and context pipeline is unchanged — the toolbar popovers
                 simply drive them. -->
            <div class="composer" id="composer" data-composer-style="toolbar">
              <!-- Run status header (idle → sending → working → done/error) -->
              <div class="composer-status" id="composerStatus" role="status" aria-live="polite" hidden></div>

              <!-- Context chips (only present when context has been added) -->
              <div class="context-hints" id="contextHints" aria-label="Context references"></div>

              <!-- The prompt -->
              <textarea id="input" rows="1" placeholder="Ask OPai to build, fix, or explain…" aria-label="Prompt"></textarea>

              <!-- Command-bar token accelerators (command style only) -->
              <div class="composer-tokens" id="composerTokens" hidden>
                <button class="ctok" type="button" data-token="#">#file</button>
                <button class="ctok" type="button" data-token="/">/mode</button>
                <button class="ctok" type="button" data-token="@">@model</button>
                <span class="ctok-hint">Type <kbd>#</kbd> for files · <kbd>/</kbd> for mode · <kbd>@</kbd> for model</span>
              </div>

              <!-- Quiet toolbar -->
              <div class="composer-toolbar">
                <button class="ctool ctool-ctx" id="ctxBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Add files, a folder, or repository — Ctrl+/" aria-label="Add context">
                  <span class="ctool-ico" data-icon="plus" aria-hidden="true"></span><span class="ctool-txt">Add context</span>
                </button>
                <button class="ctool ctool-icon" id="moreBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Composer settings" aria-label="Composer settings">
                  <span class="ctool-ico" data-icon="settings" aria-hidden="true"></span>
                </button>
                <div class="ctool-spacer"></div>
                <button class="build-pill" id="buildToggle" aria-pressed="true" hidden><span data-icon="sparkles" aria-hidden="true"></span> Build</button>
                <button class="ctool ctool-mode" id="modeBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Mode" title="How OPai handles changes">
                  <span class="mode-dot" id="modeDot" aria-hidden="true"></span><span class="ctool-txt" id="modeBtnLabel">Ask before edits</span><span class="chev" data-icon="chevronDown" aria-hidden="true"></span>
                </button>
                <button class="ctool ctool-model" id="modelBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Model" title="Model and routing">
                  <span class="ctool-txt" id="modelBtnLabel">Auto</span><span class="chev" data-icon="chevronDown" aria-hidden="true"></span>
                </button>
                <button class="send" id="send" type="button" aria-label="Send prompt">Send</button>
              </div>

              <!-- Popovers (built by composer.js) -->
              <div class="cpop" id="ctxPop" role="menu" hidden></div>
              <div class="cpop" id="modePop" role="menu" hidden></div>
              <div class="cpop" id="modelPop" role="menu" hidden></div>
              <div class="cpop" id="morePop" role="menu" hidden></div>

              <!-- Drag overlay -->
              <div class="composer-drop" id="composerDrop" aria-hidden="true">
                <span class="drop-ico" data-icon="plus" aria-hidden="true"></span>
                <span>Drop files to add them as context</span>
              </div>

              <!-- Native controls: hidden, still fully functional; the redesign
                   surfaces above drive these so backend behaviour is unchanged. -->
              <div class="composer-native" aria-hidden="true">
                <div class="composer-context" id="composerContext"></div>
                <select class="select" id="modeSel" aria-label="Mode" tabindex="-1"></select>
                <select class="select" id="modelSel" aria-label="Model" tabindex="-1"></select>
                <span class="pdot" id="providerDot"></span>
                <input class="context-path" id="contextPath" autocomplete="off" placeholder="src/file.py" tabindex="-1" />
                <button class="context-add" id="addContext" type="button" tabindex="-1">Add context</button>
              </div>
            </div>

            <!-- The help row is gone. It carried a keyboard hint that is true
                 once and noise forever, and a summary of the mode and model
                 that the two buttons directly above it already name. What is
                 left below the card is the reason line, which only appears
                 when something actually blocks a send. -->
            <div class="composer-reason" id="composerReason" aria-live="polite"></div>
            <!-- #295: a message typed while a run is active is held, never
                 discarded. It sends itself when the run finishes. -->
            <div class="composer-queued" id="composerQueued" aria-live="polite" hidden></div>
          </div>
        </section>

        <!-- dashboard -->
        <section class="view" id="view-dashboard">
          <div class="scroll"><div class="page" id="dashPage"></div></div>
        </section>

        <!-- prompts -->
        <section class="view" id="view-prompts">
          <div class="scroll"><div class="page">
            <div class="page-title">Prompt Library</div>
            <div class="page-sub">Curated starting points. Pick one to load it into the composer.</div>
            <div class="lib-controls">
              <input class="search" id="promptSearch" placeholder="Search prompts…" />
              <select class="select" id="promptCat"></select>
            </div>
            <div id="promptList"></div>
          </div></div>
        </section>

        <!-- settings -->
        <section class="view" id="view-settings">
          <div class="scroll"><div class="page" id="settingsPage"></div></div>
        </section>
      </div>
    </main>

    <!-- inspector -->
    <aside class="inspector" id="inspector"></aside>
    <button class="sidebar-backdrop" id="sidebarBackdrop" aria-label="Close sidebar"></button>
  </div>

  <div class="resize-zone north" data-edge="top" aria-hidden="true"></div>
  <div class="resize-zone east" data-edge="right" aria-hidden="true"></div>
  <div class="resize-zone south" data-edge="bottom" aria-hidden="true"></div>
  <div class="resize-zone west" data-edge="left" aria-hidden="true"></div>
  <div class="resize-zone north-east" data-edge="top-right" aria-hidden="true"></div>
  <div class="resize-zone south-east" data-edge="bottom-right" aria-hidden="true"></div>
  <div class="resize-zone south-west" data-edge="bottom-left" aria-hidden="true"></div>
  <div class="resize-zone north-west" data-edge="top-left" aria-hidden="true"></div>

  <!-- command palette -->
  <div class="overlay" id="palette">
    <div class="palette" role="dialog" aria-modal="true" aria-label="Commands">
      <input id="paletteInput" placeholder="Type a command…" aria-label="Search commands" />
      <div class="list" id="paletteList"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="vendor/markdown-it-14.1.0.min.js"></script>
  <script src="markdown-renderer.js"></script>
  <script src="chat-components.js"></script>
  <script src="activity.js"></script>
  <script src="generated-lifecycle.js"></script>
  <script src="run-result.js"></script>
  <script src="message-state.js"></script>
  <script src="icons.js"></script>
  <script src="settings.js"></script>
  <script src="onboarding.js"></script>
  <script src="app.js"></script>
  <script src="composer.js"></script>
</body>
</html>
