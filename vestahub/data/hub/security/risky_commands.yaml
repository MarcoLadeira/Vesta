schema_version: 1
deny:
  # download + execute — original and pipe-spacing bypass forms
  - "curl * | sh"
  - "curl * | bash"
  - "curl * | zsh"
  - "curl * | fish"
  - "wget * | sh"
  - "wget * | bash"
  # PowerShell download + execute
  - "invoke-webrequest * | iex"
  - "iwr * | iex"
  - "iex *"
  - "invoke-expression *"
  # chmod world-writable
  - "chmod -r 777"
  - "chmod 777 -r"
  - "chmod -r 0777"
  # cmd.exe wrappers for destructive ops
  - "cmd /c rmdir*"
  - "cmd /c del *"
  - "cmd.exe /c rmdir*"
  - "cmd.exe /c del *"
confirm:
  - "git push"
  # git commit is intentionally NOT confirm-gated: it is local and undoable
  # (git reset --soft HEAD~1), matching is_destructive_command which excludes
  # it. Gating it here left Full Auto unable to commit at all — the PreToolUse
  # hook hard-denies confirm-only commands with no interactive approval — so a
  # create+commit workflow could never complete through the GUI (Bug 2).
  #
  # git merge and git rebase were removed for exactly the same reason, and it
  # was the same bug: both are local and undoable (`--abort` mid-operation,
  # `git reset --hard ORIG_HEAD` after, and the reflog behind both), so the
  # stated rule for this list — touches shared state, or is hard to undo —
  # never applied to them. The gate has no interactive channel, so "confirm"
  # means "hard deny" in an autonomous run: an agent that had pushed a branch
  # and opened a PR could not then merge origin/main to resolve a conflict,
  # and was told not to work around it. The giveaway that the rule was
  # matching the word rather than the effect is that `git merge --abort` and
  # `git rebase --abort` — the undo operations — were gated too.
  #
  # What stays gated is what the rule actually describes: push (remote),
  # reset --hard and clean (discard uncommitted work), branch delete, and the
  # gh mutations. A rebase that would need a force-push to publish is still
  # stopped at the force-push, which is classified destructive and denied.
  - "git reset --hard"
  - "git clean -f*"
  - "git branch -d *"
  - "git branch -D"
  # GitHub CLI mutations: closing/commenting/merging changes shared remote
  # state and must never run without explicit confirmation (F23).
  - "gh issue close"
  - "gh issue comment"
  - "gh issue create"
  - "gh issue delete"
  - "gh issue edit"
  - "gh issue reopen"
  - "gh pr close"
  - "gh pr comment"
  - "gh pr create"
  - "gh pr edit"
  - "gh pr merge"
  - "gh pr review"
  - "gh release create"
  - "gh release delete"
  - "gh release edit"
  - "gh api"
  - "gh repo archive"
  - "gh repo delete"
  - "Remove-Item -Recurse"
  - "rm -rf"
  - "rm -fr"
  - "rm -r"
  - "rm --recursive*"
  - "docker system prune"
  - "docker compose down -v"
  - "npm publish"
  - "twine upload"
  - "terraform apply"
  - "kubectl delete"
  - "vercel --prod"
  - "wrangler deploy"
safe_examples:
  - "git status --short --branch"
  - "python -m unittest discover -s tests"
  - "python -m opcoding tools . run ruff"
