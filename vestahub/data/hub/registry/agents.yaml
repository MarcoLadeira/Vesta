{
  "schema_version": 1,
  "agents": [
    {
      "id": "hub-router",
      "name": "Hub Router Agent",
      "purpose": "Select tools, agents, workflows, and model tier for a task.",
      "inputs": ["user task", "tool registry", "agent registry", "cost policy"],
      "outputs": ["route", "selected tools", "selected workflow", "escalation status"],
      "tools_allowed": ["op-ai-hub-cli", "opcoding-cli"],
      "tools_forbidden": ["cloud write APIs", "destructive shell"],
      "cost_policy": "L0 first; L4 requires confirmation",
      "permission_policy": "read registries only in Phase 1",
      "escalation_policy": "escalate only when local evidence is insufficient",
      "default_model_tier": "L0",
      "max_context_policy": "registry summaries plus relevant task only",
      "run_triggers": ["any hub task", "workflow request", "tool selection"],
      "stop_conditions": ["missing registry", "expensive action without confirmation"]
    },
    {
      "id": "cost-controller",
      "name": "Cost Controller Agent",
      "purpose": "Block unnecessary model calls and enforce budgets.",
      "inputs": ["task", "budget", "route", "context size"],
      "outputs": ["cost decision", "budget warnings"],
      "tools_allowed": ["op-hub cost status", "opcoding cost report"],
      "tools_forbidden": ["paid model calls"],
      "cost_policy": "hard gate before cloud tools",
      "permission_policy": "read-only",
      "escalation_policy": "ask before paid or L4",
      "default_model_tier": "L0",
      "max_context_policy": "no source files required",
      "run_triggers": ["before AI", "before cloud", "before workflow"],
      "stop_conditions": ["budget exceeded", "missing confirmation"]
    },
    {
      "id": "context-manager",
      "name": "Context Manager Agent",
      "purpose": "Build compact reusable context from scans, diffs, docs, and memory.",
      "inputs": ["project path", "scan", "diff", "docs"],
      "outputs": ["context summary", "memory entries"],
      "tools_allowed": ["opcoding context", "opcoding index", "sqlite-local"],
      "tools_forbidden": ["whole-repo prompt upload"],
      "cost_policy": "summarize locally before AI",
      "permission_policy": "project paths only",
      "escalation_policy": "strong model only for unclear architecture",
      "default_model_tier": "L1",
      "max_context_policy": "diff first, then targeted files",
      "run_triggers": ["project attach", "large task", "long session"],
      "stop_conditions": ["secret detected", "context too large without compression"]
    },
    {
      "id": "tool-discovery",
      "name": "Tool Discovery Agent",
      "purpose": "Find existing registry tools and avoid duplicates.",
      "inputs": ["desired capability", "tool registry"],
      "outputs": ["matching tools", "gap report"],
      "tools_allowed": ["op-hub list-tools"],
      "tools_forbidden": ["installers"],
      "cost_policy": "registry search only",
      "permission_policy": "read-only",
      "escalation_policy": "do not use AI unless registry is ambiguous",
      "default_model_tier": "L0",
      "max_context_policy": "registry metadata only",
      "run_triggers": ["before adding tools", "workflow design"],
      "stop_conditions": ["duplicate found"]
    },
    {
      "id": "tool-installer",
      "name": "Tool Installer Agent",
      "purpose": "Plan safe installation of free/local tools.",
      "inputs": ["tool metadata", "project policy"],
      "outputs": ["install plan", "health check"],
      "tools_allowed": ["opcoding tools install", "op-hub tool health"],
      "tools_forbidden": ["paid services", "global destructive installs"],
      "cost_policy": "free/open-source only by default",
      "permission_policy": "project-local install preferred",
      "escalation_policy": "ask before network or global install",
      "default_model_tier": "L0",
      "max_context_policy": "tool metadata only",
      "run_triggers": ["tool add", "missing health check"],
      "stop_conditions": ["paid/subscription required", "license unclear"]
    },
    {
      "id": "tool-health",
      "name": "Tool Health Agent",
      "purpose": "Run safe health checks for registered tools.",
      "inputs": ["tool registry", "project path"],
      "outputs": ["health report"],
      "tools_allowed": ["op-hub tool health"],
      "tools_forbidden": ["destructive commands"],
      "cost_policy": "local checks only",
      "permission_policy": "health commands must be read-only",
      "escalation_policy": "never escalate automatically",
      "default_model_tier": "L0",
      "max_context_policy": "tool metadata only",
      "run_triggers": ["doctor", "daily hub check"],
      "stop_conditions": ["health command missing"]
    },
    {
      "id": "coding-planner",
      "name": "Coding Planner Agent",
      "purpose": "Plan code work with local evidence and tests.",
      "inputs": ["task", "context", "diff"],
      "outputs": ["implementation plan", "tests", "risks"],
      "tools_allowed": ["opcoding plan", "opcoding context", "opcoding test"],
      "tools_forbidden": ["deploy", "push"],
      "cost_policy": "cheap model only after local scan",
      "permission_policy": "read-only planning",
      "escalation_policy": "L3 for architecture; L4 with confirmation only",
      "default_model_tier": "L2",
      "max_context_policy": "target files and summaries",
      "run_triggers": ["feature_plan", "bug_fix"],
      "stop_conditions": ["requirements unclear", "destructive change requested"]
    },
    {
      "id": "implementation",
      "name": "Implementation Agent",
      "purpose": "Make scoped code changes from an approved plan.",
      "inputs": ["plan", "target files", "tests"],
      "outputs": ["patch", "verification result"],
      "tools_allowed": ["filesystem", "opcoding test", "ruff"],
      "tools_forbidden": ["git push", "deploy"],
      "cost_policy": "local edits first",
      "permission_policy": "project root only",
      "escalation_policy": "ask after repeated failed local attempts",
      "default_model_tier": "L2",
      "max_context_policy": "touched files only",
      "run_triggers": ["approved plan"],
      "stop_conditions": ["tests fail repeatedly", "unsafe file path"]
    },
    {
      "id": "broken-code-fixer",
      "name": "Broken Code Fixer Agent",
      "purpose": "Diagnose failures from logs and diffs before AI reasoning.",
      "inputs": ["failing command", "logs", "diff"],
      "outputs": ["root cause", "minimal patch", "test result"],
      "tools_allowed": ["opcoding fix", "opcoding test", "ruff"],
      "tools_forbidden": ["full rewrite"],
      "cost_policy": "reproduce locally before model",
      "permission_policy": "project root only",
      "escalation_policy": "L3 after failed hypotheses",
      "default_model_tier": "L2",
      "max_context_policy": "logs and stack files only",
      "run_triggers": ["test_failure_debug", "bug_fix"],
      "stop_conditions": ["failure cannot be reproduced"]
    },
    {
      "id": "testing",
      "name": "Testing Agent",
      "purpose": "Detect and run targeted tests before full suites.",
      "inputs": ["project profile", "diff", "test logs"],
      "outputs": ["test command", "results", "missing tests"],
      "tools_allowed": ["opcoding test", "pyright", "ruff"],
      "tools_forbidden": ["paid AI for passing tests"],
      "cost_policy": "no AI for green tests",
      "permission_policy": "test commands only",
      "escalation_policy": "AI only for ambiguous failures",
      "default_model_tier": "L0",
      "max_context_policy": "test logs and touched files",
      "run_triggers": ["code changed", "test failure"],
      "stop_conditions": ["no test command and no explicit command"]
    },
    {
      "id": "gitops",
      "name": "GitOps Agent",
      "purpose": "Summarize diffs, draft commits/PRs, and block unsafe git actions.",
      "inputs": ["git status", "diff", "task"],
      "outputs": ["summary", "commit message", "PR draft"],
      "tools_allowed": ["opcoding git", "detect-secrets"],
      "tools_forbidden": ["git push", "merge", "branch delete"],
      "cost_policy": "local git only",
      "permission_policy": "confirmation for write operations",
      "escalation_policy": "L3 for risky release diffs",
      "default_model_tier": "L0",
      "max_context_policy": "diff only",
      "run_triggers": ["pull_request_review", "release"],
      "stop_conditions": ["secret detected"]
    },
    {
      "id": "code-review",
      "name": "Code Review Agent",
      "purpose": "Find bugs, regressions, missing tests, and security risks.",
      "inputs": ["diff", "tests", "policy"],
      "outputs": ["findings"],
      "tools_allowed": ["opcoding review", "ruff", "bandit", "detect-secrets"],
      "tools_forbidden": ["style-only blockers by default"],
      "cost_policy": "static checks before model review",
      "permission_policy": "read-only",
      "escalation_policy": "L3 for security/API/concurrency changes",
      "default_model_tier": "L2",
      "max_context_policy": "diff plus impacted files",
      "run_triggers": ["pull_request_review"],
      "stop_conditions": ["no diff"]
    },
    {
      "id": "refactor",
      "name": "Refactor Agent",
      "purpose": "Perform behavior-preserving structural improvements.",
      "inputs": ["scope", "goal", "tests"],
      "outputs": ["refactor plan", "patch", "verification"],
      "tools_allowed": ["opcoding refactor", "opcoding test", "ruff"],
      "tools_forbidden": ["public API changes without approval"],
      "cost_policy": "mechanical transforms first",
      "permission_policy": "project root only",
      "escalation_policy": "L3 for public API boundaries",
      "default_model_tier": "L2",
      "max_context_policy": "scope only",
      "run_triggers": ["refactor request"],
      "stop_conditions": ["tests missing for risky change"]
    },
    {
      "id": "documentation",
      "name": "Documentation Agent",
      "purpose": "Generate concise docs from code, diffs, and workflows.",
      "inputs": ["context", "diff", "templates"],
      "outputs": ["docs patch", "summary"],
      "tools_allowed": ["markdownlint-cli2", "opcoding context"],
      "tools_forbidden": ["invented APIs"],
      "cost_policy": "templates first",
      "permission_policy": "docs paths only by default",
      "escalation_policy": "L2 for prose polishing",
      "default_model_tier": "L1",
      "max_context_policy": "docs plus relevant code summaries",
      "run_triggers": ["docs_generation"],
      "stop_conditions": ["source behavior unknown"]
    },
    {
      "id": "security",
      "name": "Security Agent",
      "purpose": "Run secret, dependency, and risky-command checks.",
      "inputs": ["diff", "dependencies", "permissions"],
      "outputs": ["security findings", "blockers"],
      "tools_allowed": ["detect-secrets", "gitleaks", "bandit", "osv-scanner"],
      "tools_forbidden": ["external exploit tools by default"],
      "cost_policy": "deterministic scanners first",
      "permission_policy": "read-only scans",
      "escalation_policy": "L3 for threat modeling",
      "default_model_tier": "L0",
      "max_context_policy": "findings and diffs only",
      "run_triggers": ["security_audit", "before commit"],
      "stop_conditions": ["secret detected"]
    },
    {
      "id": "research",
      "name": "Research Agent",
      "purpose": "Create sourced research briefs with cached web/docs lookups.",
      "inputs": ["question", "sources", "cache"],
      "outputs": ["brief", "citations"],
      "tools_allowed": ["web search", "docs cache"],
      "tools_forbidden": ["paid APIs by default"],
      "cost_policy": "search/cache before model",
      "permission_policy": "read-only web",
      "escalation_policy": "L3 for synthesis only",
      "default_model_tier": "L2",
      "max_context_policy": "source snippets and notes",
      "run_triggers": ["research_brief"],
      "stop_conditions": ["source unavailable"]
    },
    {
      "id": "browser-automation",
      "name": "Browser Automation Agent",
      "purpose": "Inspect localhost/UI flows with screenshots and logs.",
      "inputs": ["URL", "flow", "assertions"],
      "outputs": ["screenshots", "console logs", "findings"],
      "tools_allowed": ["playwright-optional"],
      "tools_forbidden": ["external login without approval"],
      "cost_policy": "local browser only",
      "permission_policy": "localhost first",
      "escalation_policy": "no model unless visual interpretation needed",
      "default_model_tier": "L0",
      "max_context_policy": "screenshots and console summaries",
      "run_triggers": ["browser test", "frontend debug"],
      "stop_conditions": ["credential prompt", "non-local external target"]
    },
    {
      "id": "data-analysis",
      "name": "Data Analysis Agent",
      "purpose": "Analyze local data files using deterministic scripts first.",
      "inputs": ["csv", "xlsx", "sqlite", "question"],
      "outputs": ["tables", "charts", "summary"],
      "tools_allowed": ["sqlite-local", "python scripts"],
      "tools_forbidden": ["uploading private data by default"],
      "cost_policy": "local computation first",
      "permission_policy": "project/local data only",
      "escalation_policy": "L2 for explanation after analysis",
      "default_model_tier": "L0",
      "max_context_policy": "aggregates, not raw data",
      "run_triggers": ["data task", "spreadsheet task"],
      "stop_conditions": ["sensitive data without policy"]
    },
    {
      "id": "workflow-builder",
      "name": "Workflow Builder Agent",
      "purpose": "Compose deterministic steps, tools, and agents into reusable workflows.",
      "inputs": ["goal", "registries", "policies"],
      "outputs": ["workflow YAML", "risk notes"],
      "tools_allowed": ["op-hub list-tools", "op-hub list-agents"],
      "tools_forbidden": ["execution by default"],
      "cost_policy": "metadata planning only",
      "permission_policy": "read-only registry first",
      "escalation_policy": "L2 for complex workflow design",
      "default_model_tier": "L1",
      "max_context_policy": "registry metadata only",
      "run_triggers": ["workflow request"],
      "stop_conditions": ["tool permissions unresolved"]
    },
    {
      "id": "local-model",
      "name": "Local Model Agent",
      "purpose": "Route eligible tasks to local models before cloud models.",
      "inputs": ["task", "local model registry", "context size"],
      "outputs": ["local model route", "fallback"],
      "tools_allowed": ["local model tools"],
      "tools_forbidden": ["cloud models without cost gate"],
      "cost_policy": "local before cloud",
      "permission_policy": "no external network by default",
      "escalation_policy": "cloud only after local miss",
      "default_model_tier": "L1",
      "max_context_policy": "small compressed prompts",
      "run_triggers": ["model route"],
      "stop_conditions": ["no local model installed"]
    },
    {
      "id": "mcp-manager",
      "name": "MCP Manager Agent",
      "purpose": "Manage MCP server metadata, profiles, and safe enablement.",
      "inputs": ["mcp registry", "project policy"],
      "outputs": ["mcp config", "risk report"],
      "tools_allowed": ["op-hub mcp list", "opcoding mcp doctor"],
      "tools_forbidden": ["write-capable MCP by default"],
      "cost_policy": "local servers first",
      "permission_policy": "roots and read-only default",
      "escalation_policy": "ask before cloud/remote MCP",
      "default_model_tier": "L0",
      "max_context_policy": "server metadata only",
      "run_triggers": ["mcp_server_setup"],
      "stop_conditions": ["missing root restriction", "unsafe permission"]
    }
  ]
}
