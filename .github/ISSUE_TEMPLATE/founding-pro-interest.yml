name: Founding Pro interest
description: Join the first OPai paid-support cohort.
title: "[Founding Pro]: "
labels: ["enhancement", "cost", "pre-alpha"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for backing OPai early. Please do not post secrets, payment details, private repo names, private logs, or private benchmark output.
  - type: input
    id: contact
    attributes:
      label: Best contact
      description: Email, GitHub handle, or another way to reach you.
      placeholder: you@example.com
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: Preferred Founding Pro plan
      options:
        - "$12/month"
        - "$99/year"
        - "Not sure yet"
    validations:
      required: true
  - type: checkboxes
    id: value
    attributes:
      label: What would make this worth paying for?
      options:
        - label: Priority install/onboarding help.
        - label: Savings report review.
        - label: Pro export templates.
        - label: Private roadmap access.
        - label: Help proving OPai against my normal AI workflow.
  - type: textarea
    id: proof
    attributes:
      label: Optional local proof
      description: Paste redacted output from `opai doctor`, `opai benchmark gate`, or `opai savings --markdown`.
      render: text
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: OPai may contact me about Founding Pro checkout and onboarding.
          required: true
