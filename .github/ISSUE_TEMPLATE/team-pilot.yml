name: Team Pilot application
description: Apply for the OPai team governance and cost-control pilot.
title: "[Team Pilot]: "
labels: ["enhancement", "cost", "routing", "security", "pre-alpha"]
body:
  - type: markdown
    attributes:
      value: |
        Team Pilot is the early revenue path for teams that already use multiple coding agents and need cost, policy, and audit proof. Please do not post secrets, customer names, private logs, or proprietary benchmark output.
  - type: input
    id: contact
    attributes:
      label: Best contact
      placeholder: you@example.com
    validations:
      required: true
  - type: input
    id: team_size
    attributes:
      label: Team size
      placeholder: "8 developers"
    validations:
      required: true
  - type: checkboxes
    id: tools
    attributes:
      label: AI coding tools in use
      options:
        - label: Claude Code
        - label: Codex
        - label: GitHub Copilot
        - label: Cursor
        - label: Cline
        - label: Other coding agents or MCP tools
  - type: checkboxes
    id: pilot_workflow
    attributes:
      label: Pilot workflow acceptance
      options:
        - label: Run `opai doctor`.
        - label: Run `opai benchmark run --suite max --mode both`.
        - label: Run `opai benchmark gate --min-effectiveness-index 95 --require-risk-blocks`.
        - label: Run `opai savings --markdown`.
        - label: Run `opai policy check` and `opai team report`.
  - type: textarea
    id: pain
    attributes:
      label: Biggest pain to solve
      description: Spend unpredictability, install drift, policy, audit, MCP risk, context waste, or something else.
    validations:
      required: true
  - type: dropdown
    id: budget
    attributes:
      label: Pilot budget readiness
      options:
        - "$199/month/team for up to 10 developers for 3 months is acceptable."
        - "We need a call before budget approval."
        - "We are interested, but cannot pay yet."
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: OPai may contact me about a Team Pilot.
          required: true
