name: Benchmark proof report
description: Share a privacy-safe OPai benchmark or savings result.
title: "[Proof]: "
labels: ["cost", "routing", "pre-alpha"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping prove OPai. Please redact private paths, private repo names, secrets, logs, prompts, and customer data before posting.
  - type: input
    id: version
    attributes:
      label: OPai version
      placeholder: opai version
    validations:
      required: true
  - type: checkboxes
    id: commands
    attributes:
      label: Commands run
      options:
        - label: "`opai doctor`"
        - label: "`opai benchmark run --suite max --mode both`"
        - label: "`opai benchmark gate --min-effectiveness-index 95 --require-risk-blocks`"
        - label: "`opai savings --markdown`"
  - type: textarea
    id: result
    attributes:
      label: Redacted output
      description: Paste the proof you are comfortable making public.
      render: text
    validations:
      required: true
  - type: dropdown
    id: share_permission
    attributes:
      label: May OPai quote this proof publicly?
      options:
        - "Yes, anonymously."
        - "Yes, with my GitHub username."
        - "No, use this only as private feedback."
    validations:
      required: true
