name: Vesta provider canary (protected)

on:
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vesta-provider-canary-${{ github.sha }}
  cancel-in-progress: false

jobs:
  dispatch-guard:
    name: Protected - reject non-main dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the trusted main ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REQUESTED_REF" != "refs/heads/main" ]; then
            echo "Provider canary dispatches must select main."
            exit 2
          fi

  provider-canary:
    name: Protected - non-production provider canary
    needs: dispatch-guard
    if: github.ref == 'refs/heads/main'
    environment:
      name: vesta-provider-canary
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      VESTA_LIVE_PROVIDER_SMOKE: "1"
      VESTA_CONFIRM_CLOUD_TESTS: "YES"
      VESTA_PROVIDER_CANARY_NON_PRODUCTION: "YES"
      VESTA_LIVE_PROVIDER_SMOKE_PROVIDERS: ${{ vars.VESTA_PROVIDER_CANARY_PROVIDERS }}
      VESTA_LIVE_MODELS: ${{ vars.VESTA_PROVIDER_CANARY_MODELS }}
      VESTA_PROVIDER_CANARY_MAX_USD: ${{ vars.VESTA_PROVIDER_CANARY_MAX_USD }}
    steps:
      - name: Checkout exact trusted candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned canary dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Run protected exact-SHA provider canary
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: >-
          python scripts/ci_local.py --profile provider-canary --component provider
          --candidate-sha "${{ github.sha }}" --manifest provider-canary-evidence.json

      - name: Upload immutable redacted provider evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-canary-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: provider-canary-evidence.json
          if-no-files-found: error
          retention-days: 14
