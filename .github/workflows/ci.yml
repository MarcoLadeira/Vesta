name: OPai CI (hosted)

# The credential-free fast lane is the required PR/main gate.  The scheduled
# full/native lane is intentionally separate: expensive platform evidence must
# be current, but it must not give an untrusted pull request a privileged runner
# or provider/signing secret.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: "Qualification profile to run"
        required: true
        default: fast
        type: choice
        options: [fast, full]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

permissions:
  contents: read

concurrency:
  # A cancelled run never produces a green check for its successor: GitHub
  # records the newer SHA as a distinct required check run.
  group: opai-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mandatory-python:
    name: Required - Python quality (${{ matrix.python-version }})
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.profile == 'fast')
    # The canonical Python suite contains Windows desktop contracts, so the
    # required PR member must run on Windows too (not only post-merge).
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: >-
          ${{ (github.event_name == 'pull_request'
            && fromJSON('["3.13"]'))
            || fromJSON('["3.10", "3.13"]') }}
    steps:
      # actions/checkout v4.2.2, pinned to its immutable commit SHA.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-python v5.6.0, pinned to its immutable commit SHA.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked CI tools and OPai test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e ".[test]"

      - name: Run mandatory fast profile
        run: python scripts/ci_local.py --profile fast --manifest ci-fast-evidence.json

      - name: Publish typed CI summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          evidence = json.loads(Path("ci-fast-evidence.json").read_text())
          print("### OPai fast qualification")
          print(f"- Verdict: `{evidence['verdict']}`")
          print(f"- Classification: `{evidence['classification']}`")
          print(f"- Reason: `{evidence['reason']}`")
          print(f"- Commit: `{evidence['commit_sha']}`")
          PY

      # actions/upload-artifact v4.6.2, pinned to its immutable commit SHA.
      - name: Upload bounded CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-fast-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}
          path: ci-fast-evidence.json
          if-no-files-found: error
          retention-days: 14

  mandatory-hostile-environment:
    name: Required - hostile-environment Python suites
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.profile == 'fast')
    # Use the same supported OS as the canonical desktop-contract suite.
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # Deliberately fake values prove that no live provider credential is read.
      MOONSHOT_API_KEY: hostile-moonshot # pragma: allowlist secret
      GOOGLE_API_KEY: hostile-google # pragma: allowlist secret
      GROQ_API_KEY: hostile-groq # pragma: allowlist secret
      MISTRAL_API_KEY: hostile-mistral # pragma: allowlist secret
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install locked CI tools and OPai test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e ".[test]"

      - name: Run canonical unittest suite with populated keyring
        env:
          PYTHONPATH: tests/fixtures/hostile_keyring
        run: python -m unittest discover -s tests

      - name: Run pytest suite with populated keyring
        env:
          PYTHONPATH: tests/fixtures/hostile_keyring
        run: python -m pytest tests -q

  web-test:
    name: Required - web UI security and E2E
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.profile == 'fast')
    # The committed Playwright visual baselines are Windows Chromium images;
    # running them elsewhere turns renderer/font variation into false failures.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-node v4.4.0, pinned to its immutable commit SHA.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python for the Playwright web server
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install locked development dependencies
        run: npm ci

      - name: Audit JavaScript development dependencies
        run: npm audit --audit-level=high

      - name: Enforce web design tokens
        run: npm run test:tokens

      - name: Run JavaScript unit tests
        run: npm run test:unit

      - name: Install Chromium for the Windows visual baseline
        run: npx playwright install chromium

      - name: Run Chromium end-to-end tests
        run: npm run test:e2e

      - name: Upload redacted browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  scheduled-full:
    name: Scheduled - full Python qualification
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install locked CI tools and OPai test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e ".[test]"

      - name: Run full qualification profile
        run: python scripts/ci_local.py --profile full --manifest ci-full-evidence.json

      - name: Publish typed CI summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          evidence = json.loads(Path("ci-full-evidence.json").read_text())
          print("### OPai full qualification")
          print(f"- Verdict: `{evidence['verdict']}`")
          print(f"- Classification: `{evidence['classification']}`")
          print(f"- Reason: `{evidence['reason']}`")
          print(f"- Commit: `{evidence['commit_sha']}`")
          PY

      - name: Upload bounded CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-full-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-full-evidence.json
          if-no-files-found: error
          retention-days: 14

  scheduled-native:
    name: Scheduled - native wheel qualification (${{ matrix.os }})
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'full')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Run isolated wheel qualification
        run: python scripts/ci_local.py --profile native --manifest ci-native-evidence.json

      - name: Publish typed CI summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          evidence = json.loads(Path("ci-native-evidence.json").read_text())
          print("### OPai native qualification")
          print(f"- Verdict: `{evidence['verdict']}`")
          print(f"- Classification: `{evidence['classification']}`")
          print(f"- Reason: `{evidence['reason']}`")
          print(f"- Commit: `{evidence['commit_sha']}`")
          PY

      - name: Upload bounded native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: ci-native-evidence.json
          if-no-files-found: error
          retention-days: 14
