name: Vesta CI (hosted)

on:
  pull_request:
    branches: [main, "release/**", "rc/**"]
  merge_group:
  push:
    branches: [main, "release/**", "rc/**"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: Qualification profile to run
        required: true
        default: fast
        type: choice
        options: [fast, full]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

permissions:
  contents: read

concurrency:
  group: vesta-ci-${{ github.event_name }}-${{ github.event.inputs.profile || 'automatic' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mandatory-python:
    name: Required - Python quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Every supported interpreter, on every event -- deliberately.
        #
        # This used to narrow pull requests to 3.13 while pushes to main ran
        # 3.10 and 3.13, which made a 3.10-only breakage structurally
        # impossible to catch before merge: scripts/desktop_release_transport
        # imported tomllib (3.11+) against a declared
        # requires-python = ">=3.10", every pull request went green, and every
        # push to main then failed six tests. Six merges landed on a red main
        # before anyone looked at main's own CI rather than the branch's.
        #
        # A merge gate that tests less than the branch it protects is not a
        # gate. The minutes saved were paid back the first time someone had to
        # learn from main why main was broken.
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          # A shallow clone truncates parent commits, so `git show -s --format=%P`
          # returns nothing and the PR head can never be matched against the
          # merge candidate's parents. Depth 2 is the minimum that keeps the
          # exact-SHA parent check verifiable (#621).
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned CI and test dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Run exact-SHA Python component
        run: >-
          python scripts/ci_local.py --profile fast --component python
          --candidate-sha "${{ github.sha }}"
          --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --manifest ci-python-evidence.json

      - name: Publish typed qualification summary
        if: always()
        shell: bash
        run: |
          if [ -f ci-python-evidence.json ]; then
            python scripts/render_ci_summary.py ci-python-evidence.json >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '### Vesta Python qualification' '- Verdict: `infrastructure_blocked`' '- Reason: evidence manifest was not produced' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable Python evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-python-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ matrix.python-version }}
          path: ci-python-evidence.json
          if-no-files-found: error
          retention-days: 14

  mandatory-hostile-environment:
    name: Required - hostile-environment Python suites
    runs-on: ubuntu-latest
    # This lane deliberately executes both unittest and pytest under the hostile
    # environment. Keep a job boundary above the two independent 30-minute step
    # limits so GitHub cannot cancel valid evidence between the runners.
    timeout-minutes: 70
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          # A shallow clone truncates parent commits, so `git show -s --format=%P`
          # returns nothing and the PR head can never be matched against the
          # merge candidate's parents. Depth 2 is the minimum that keeps the
          # exact-SHA parent check verifiable (#621).
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned CI and test dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Run exact-SHA hostile component
        run: >-
          python scripts/ci_local.py --profile fast --component hostile
          --candidate-sha "${{ github.sha }}"
          --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --manifest ci-hostile-evidence.json

      - name: Upload immutable hostile-environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-hostile-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ci-hostile-evidence.json
          if-no-files-found: error
          retention-days: 14

  web-test:
    name: Required - web UI security and E2E
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          # A shallow clone truncates parent commits, so `git show -s --format=%P`
          # returns nothing and the PR head can never be matched against the
          # merge candidate's parents. Depth 2 is the minimum that keeps the
          # exact-SHA parent check verifiable (#621).
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python for the Playwright server and evidence runner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Run exact-SHA web component
        run: >-
          python scripts/ci_local.py --profile fast --component web
          --candidate-sha "${{ github.sha }}"
          --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --manifest ci-web-evidence.json

      - name: Upload bounded redacted web evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-web-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ci-web-evidence.json
          if-no-files-found: error
          retention-days: 7

  mandatory-gui:
    name: Required - desktop GUI smoke (offscreen)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The real-window render smoke tests are gated on `find_spec("PySide6")`.
    # Without this lane installing the desktop-gui extra they skip in every CI
    # lane, so a broken renderer would merge green (#908). Qt runs against the
    # offscreen platform, so the hosted runner needs no display.
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          # A shallow clone truncates parent commits, so `git show -s --format=%P`
          # returns nothing and the PR head can never be matched against the
          # merge candidate's parents. Depth 2 is the minimum that keeps the
          # exact-SHA parent check verifiable (#621).
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            pyproject.toml

      - name: Install Qt offscreen runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install pinned CI, test, and desktop-gui dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-build-isolation -e ".[desktop-gui]"
          python -m pip check

      - name: Run exact-SHA desktop GUI component
        run: >-
          python scripts/ci_local.py --profile fast --component gui
          --candidate-sha "${{ github.sha }}"
          --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --manifest ci-gui-evidence.json

      - name: Upload immutable GUI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-gui-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ci-gui-evidence.json
          if-no-files-found: error
          retention-days: 14

  scheduled-full:
    name: Scheduled - full supply-chain qualification
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          # A shallow clone truncates parent commits, so `git show -s --format=%P`
          # returns nothing and the PR head can never be matched against the
          # merge candidate's parents. Depth 2 is the minimum that keeps the
          # exact-SHA parent check verifiable (#621).
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned CI and test dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Run exact-SHA supply-chain component
        run: >-
          python scripts/ci_local.py --profile full --component supply-chain
          --candidate-sha "${{ github.sha }}" --manifest ci-full-evidence.json

      - name: Upload immutable full evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-full-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ci-full-evidence.json
          if-no-files-found: error
          retention-days: 14

  scheduled-native:
    name: Scheduled - native wheel qualification (${{ matrix.os }})
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'full')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          # A shallow clone truncates parent commits, so `git show -s --format=%P`
          # returns nothing and the PR head can never be matched against the
          # merge candidate's parents. Depth 2 is the minimum that keeps the
          # exact-SHA parent check verifiable (#621).
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install pinned native qualification dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Run exact-SHA native component
        run: >-
          python scripts/ci_local.py --profile native --component native
          --candidate-sha "${{ github.sha }}" --manifest ci-native-evidence.json

      - name: Upload immutable native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ matrix.os }}
          path: ci-native-evidence.json
          if-no-files-found: error
          retention-days: 14
