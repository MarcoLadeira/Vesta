name: OPai CI (hosted)

# GitHub-hosted CI. Manual-only for now: this private repo's Actions minutes are
# capped, so on push/pull_request every job aborts at startup (0 steps) and shows
# red even though the code is fine. Day-to-day CI runs on the self-hosted runner
# (ci-selfhosted.yml) at $0. Run this full hosted matrix on demand — e.g. before
# a release, or once the Actions spending limit is raised — via the Actions tab
# ("Run workflow"). To restore automatic hosted CI, add back the `pull_request:`
# and `push:` triggers below.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: opai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    # Pull requests run on Linux (billed 1x) for cheap, fast feedback. Push to
    # main and manual dispatch run on Windows (2x) -- OPai is a Windows-first
    # desktop app with Windows-specific process handling (CREATE_NO_WINDOW,
    # taskkill, process-group kills), so the platform that actually ships is the
    # one that gates code landing on main. Nothing merges without a Windows run.
    runs-on: >-
      ${{ (github.event_name == 'pull_request' && 'ubuntu-latest')
        || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Fast feedback on pull requests runs the min-supported and current
        # Python only where it is cheapest. The full span (3.10 + 3.13) runs on
        # push to main and on manual dispatch, so nothing merges to main without
        # both being exercised. Windows minutes bill at 2x on private repos, so
        # halving the PR matrix is the single biggest per-PR saving.
        python-version: >-
          ${{ (github.event_name == 'pull_request'
            && fromJSON('["3.13"]'))
            || fromJSON('["3.10", "3.13"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python check tools
        run: |
          python -m pip install --upgrade pip
          # Pin ruff so the format check is deterministic. Unpinned, CI grabs the
          # latest ruff each run, and its evolving formatter drifts files out of
          # compliance even when nothing changed — the recurring "format always
          # fails" failure. Bump this deliberately and reformat in the same PR.
          python -m pip install "ruff==0.15.9" bandit pip-audit detect-secrets

      - name: Install OPai editable
        run: python -m pip install -e ".[test]"

      - name: Format check
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Lifecycle projections are not stale (#612)
        run: python scripts/generate_lifecycle.py --check

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Registry validation
        run: python -m opaihub validate

      - name: Security scan
        run: python -m bandit -r opai opaihub opcoding -q

      - name: Dependency audit
        run: python -m pip_audit . --progress-spinner off --skip-editable

      - name: Secret scan
        run: >
          detect-secrets scan --all-files
          --exclude-files "(^|[\\/])\\.opcoding-tools([\\/]|$)|(^|[\\/])\\.ruff_cache([\\/]|$)|(^|[\\/])\\.opcoding([\\/]|$)|(^|[\\/])\\.opaihub([\\/]|$)|(^|[\\/])opai[\\/]assets[\\/].*\\.png$"
          --exclude-lines "MORPH_API_KEY|api_key_env|api_key_present"

  hermetic-tests:
    name: Hostile-environment Python suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOONSHOT_API_KEY: hostile-moonshot # pragma: allowlist secret
      GOOGLE_API_KEY: hostile-google # pragma: allowlist secret
      GROQ_API_KEY: hostile-groq # pragma: allowlist secret
      MISTRAL_API_KEY: hostile-mistral # pragma: allowlist secret
      GH_TOKEN: hostile-gh # pragma: allowlist secret
      GITHUB_TOKEN: hostile-github # pragma: allowlist secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install OPai and pytest
        run: python -m pip install -e ".[test]" pytest

      - name: Run canonical unittest suite with populated keyring
        env:
          PYTHONPATH: tests/fixtures/hostile_keyring
        run: python -m unittest discover -s tests

      - name: Run pytest suite with populated keyring
        env:
          PYTHONPATH: tests/fixtures/hostile_keyring
        run: python -m pytest tests -q

  clean-install:
    name: Clean wheel install (${{ matrix.os }})
    # The three-OS wheel matrix includes a macOS runner, billed at 10x private-
    # repo minutes — by far the most expensive job here. It proves cross-OS
    # packaging, which only needs to hold at the point code lands on main (or a
    # deliberate pre-release dispatch), not on every PR push. PRs still get the
    # full test/lint/security gate plus web E2E; they just skip cross-OS wheels.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade package installer
        run: python -m pip install --upgrade pip

      - name: Build, install, and smoke the wheel in isolation
        run: python scripts/smoke-install.py

  web-test:
    name: Web UI security and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python for the Playwright web server
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked development dependencies
        run: npm ci

      - name: Audit JavaScript development dependencies
        run: npm audit --audit-level=high

      - name: Enforce web design tokens
        run: npm run test:tokens

      - name: Run JavaScript unit tests
        run: npm run test:unit

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Chromium end-to-end tests
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
