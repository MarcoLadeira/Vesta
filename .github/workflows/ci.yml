name: OPai CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: opai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python check tools
        run: |
          python -m pip install --upgrade pip
          # Pin ruff so the format check is deterministic. Unpinned, CI grabs the
          # latest ruff each run, and its evolving formatter drifts files out of
          # compliance even when nothing changed — the recurring "format always
          # fails" failure. Bump this deliberately and reformat in the same PR.
          python -m pip install "ruff==0.15.9" bandit pip-audit detect-secrets

      - name: Install OPai editable
        run: python -m pip install -e . --no-deps

      - name: Format check
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Registry validation
        run: python -m opaihub validate

      - name: Security scan
        run: python -m bandit -r opai opaihub opcoding -q

      - name: Dependency audit
        run: python -m pip_audit . --progress-spinner off --skip-editable

      - name: Secret scan
        run: >
          detect-secrets scan --all-files
          --exclude-files "(^|[\\/])\\.opcoding-tools([\\/]|$)|(^|[\\/])\\.ruff_cache([\\/]|$)|(^|[\\/])\\.opcoding([\\/]|$)|(^|[\\/])\\.opaihub([\\/]|$)|(^|[\\/])opai[\\/]assets[\\/].*\\.png$"
          --exclude-lines "MORPH_API_KEY|api_key_env|api_key_present"

      - name: Isolated install smoke
        run: python scripts/smoke-install.py

  web-test:
    name: Web UI security and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python for the Playwright web server
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked development dependencies
        run: npm ci

      - name: Audit JavaScript development dependencies
        run: npm audit --audit-level=high

      - name: Run JavaScript unit tests
        run: npm run test:unit

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Chromium end-to-end tests
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
