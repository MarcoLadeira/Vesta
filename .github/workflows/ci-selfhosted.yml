name: OPai CI (trusted self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: opai-ci-selfhosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-guard:
    name: Trusted - reject non-main dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the trusted main ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REQUESTED_REF" != "refs/heads/main" ]; then
            echo "Trusted self-hosted dispatches must select main."
            exit 2
          fi

  runner-health:
    name: Trusted - runner health preflight
    needs: dispatch-guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: opai-runner-health
      deployment: false
    steps:
      - name: Checkout trusted main candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Query required labelled runner
        id: query
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OPAI_RUNNER_HEALTH_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/actions/runners" > runner-inventory.json; then
            python scripts/check_runner_health.py \
              --input runner-inventory.json \
              --output runner-health-evidence.json \
              --candidate-sha "$GITHUB_SHA" \
              --label self-hosted --label Windows --label X64
          else
            python scripts/check_runner_health.py \
              --output runner-health-evidence.json \
              --candidate-sha "$GITHUB_SHA" \
              --label self-hosted --label Windows --label X64 \
              --api-error runner-api-request-failed
          fi

      - name: Upload immutable runner-health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-health-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: runner-health-evidence.json
          if-no-files-found: error
          retention-days: 14

  trusted-gate:
    name: Trusted - self-hosted fast qualification
    needs: runner-health
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    steps:
      - name: Checkout trusted main candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned tools and OPai in an isolated venv
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Python = Join-Path $PWD '.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $Python)) {
            throw "Windows virtualenv Python was not created at $Python"
          }
          & $Python -m pip install -r requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run exact-SHA trusted Python component
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Python = Join-Path $PWD '.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $Python)) {
            throw "Windows virtualenv Python is unavailable at $Python"
          }
          & $Python scripts/ci_local.py --profile fast --component python `
            --candidate-sha $env:GITHUB_SHA --manifest self-hosted-evidence.json
          exit $LASTEXITCODE

      - name: Upload immutable trusted-runner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: self-hosted-fast-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: self-hosted-evidence.json
          if-no-files-found: error
          retention-days: 14
