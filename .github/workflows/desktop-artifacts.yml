name: OPai desktop artifact rehearsal

# Every v* tag automatically rehearses the unsigned candidate. Production is a
# reviewed main-branch dispatch and adds a protected provider canary, signing,
# credential-free smoke, and attestation. No secret-bearing job executes a tag
# until its commit is proven to be reachable from the trusted main revision.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact annotated package-version tag (for example v0.2.1a1)
        required: true
        type: string
      release_channel:
        description: Unsigned alpha rehearsal or signed production release
        required: true
        default: unsigned-prealpha
        type: choice
        options:
          - unsigned-prealpha
          - production
      allow_unsigned_prealpha:
        description: Acknowledge that unsigned artifacts are pre-alpha only
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: opai-desktop-artifact-${{ github.event.inputs.release_tag || github.ref_name }}-${{ github.event.inputs.release_channel || 'unsigned-prealpha' }}
  cancel-in-progress: false

jobs:
  source-qualification:
    name: Exact-candidate source qualification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      tag_object_sha: ${{ steps.candidate.outputs.tag_object_sha }}
      package_version: ${{ steps.version.outputs.package_version }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
      RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'unsigned-prealpha' }}
    steps:
      - name: Checkout requested immutable tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove tag identity and production ancestry
        id: candidate
        shell: bash
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?$ ]]; then
            echo "release_tag must be a safe v-prefixed canonical package version."
            exit 2
          fi
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          CANDIDATE_SHA="$(git rev-parse "$RELEASE_TAG^{commit}")"
          TAG_OBJECT_SHA="$(git rev-parse "$RELEASE_TAG^{tag}")"
          test "$(git cat-file -p "$TAG_OBJECT_SHA" | sed -n '2s/^type //p')" = "commit"
          test "$(git cat-file -p "$TAG_OBJECT_SHA" | sed -n '1s/^object //p')" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [ "$RELEASE_CHANNEL" = "production" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            git merge-base --is-ancestor "$CANDIDATE_SHA" "$GITHUB_SHA"
          fi
          printf 'candidate_sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          printf 'tag_object_sha=%s\n' "$TAG_OBJECT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Validate canonical package version and release tag
        id: version
        run: >-
          python scripts/desktop_release_transport.py validate-release-tag
          --root . --release-tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Install pinned qualification dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Resolve source evidence paths outside the candidate checkout
        shell: bash
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/opai-source-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$EVIDENCE_DIR"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"

      - name: Qualify Python source for exact candidate
        shell: bash
        run: |
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          python scripts/ci_local.py --profile full --component python \
            --candidate-sha "$CANDIDATE_SHA" --manifest "$EVIDENCE_DIR/release-python-evidence.json"

      - name: Qualify hostile environment for exact candidate
        shell: bash
        run: |
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          python scripts/ci_local.py --profile full --component hostile \
            --candidate-sha "$CANDIDATE_SHA" --manifest "$EVIDENCE_DIR/release-hostile-evidence.json"

      - name: Qualify supply chain for exact candidate
        shell: bash
        run: |
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          python scripts/ci_local.py --profile full --component supply-chain \
            --candidate-sha "$CANDIDATE_SHA" --manifest "$EVIDENCE_DIR/release-supply-evidence.json"

      - name: Upload immutable source qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.inputs.release_tag || github.ref_name }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

  web-qualification:
    name: Exact-candidate web qualification
    needs: source-qualification
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
      CANDIDATE_SHA: ${{ needs.source-qualification.outputs.candidate_sha }}
      EXPECTED_TAG_OBJECT_SHA: ${{ needs.source-qualification.outputs.tag_object_sha }}
    steps:
      - name: Checkout requested immutable tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Revalidate immutable source identity
        shell: bash
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{tag}")" = "$EXPECTED_TAG_OBJECT_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Qualify web contract for exact candidate
        run: >-
          python scripts/ci_local.py --profile full --component web
          --candidate-sha "${{ needs.source-qualification.outputs.candidate_sha }}"
          --manifest release-web-evidence.json

      - name: Upload bounded immutable web evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-web-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.inputs.release_tag || github.ref_name }}
          path: release-web-evidence.json
          if-no-files-found: error
          retention-days: 30

  provider-qualification:
    name: Protected exact-candidate provider qualification
    needs: [source-qualification, web-qualification, build]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_channel == 'production' && github.ref == 'refs/heads/main' }}
    environment:
      name: opai-provider-canary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      OPAI_LIVE_PROVIDER_SMOKE: "1"
      OPAI_CONFIRM_CLOUD_TESTS: "YES"
      OPAI_PROVIDER_CANARY_NON_PRODUCTION: "YES"
      OPAI_LIVE_PROVIDER_SMOKE_PROVIDERS: ${{ vars.OPAI_PROVIDER_CANARY_PROVIDERS }}
      OPAI_LIVE_MODELS: ${{ vars.OPAI_PROVIDER_CANARY_MODELS }}
      OPAI_PROVIDER_CANARY_MAX_USD: ${{ vars.OPAI_PROVIDER_CANARY_MAX_USD }}
      EXPECTED_CANDIDATE_SHA: ${{ needs.source-qualification.outputs.candidate_sha }}
      EXPECTED_TAG_OBJECT_SHA: ${{ needs.source-qualification.outputs.tag_object_sha }}
    steps:
      - name: Checkout reviewed candidate tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.source-qualification.outputs.candidate_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install pinned provider dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Revalidate immutable release identity before provider credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          REMOTE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq 'select(.object.type == "tag") | .object.sha')"
          test "$REMOTE_TAG_OBJECT" = "$EXPECTED_TAG_OBJECT_SHA"
          REMOTE_CANDIDATE="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${REMOTE_TAG_OBJECT}" --jq 'select(.object.type == "commit") | .object.sha')"
          test "$REMOTE_CANDIDATE" = "$EXPECTED_CANDIDATE_SHA"

      - name: Run protected exact-SHA provider qualification
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: >-
          python scripts/ci_local.py --profile provider-canary --component provider
          --candidate-sha "${{ needs.source-qualification.outputs.candidate_sha }}"
          --manifest release-provider-evidence.json

      - name: Upload immutable provider evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-provider-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.inputs.release_tag }}
          path: release-provider-evidence.json
          if-no-files-found: error
          retention-days: 30

  build:
    name: Unsigned desktop build (${{ matrix.os }})
    needs: [source-qualification, web-qualification]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_lock: requirements/desktop-build.windows.lock
          - os: macos-latest
            build_lock: requirements/desktop-build.macos.lock
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
      RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'unsigned-prealpha' }}
      ALLOW_UNSIGNED_PREALPHA: ${{ github.event_name == 'push' && 'true' || github.event.inputs.allow_unsigned_prealpha }}
      EXPECTED_CANDIDATE_SHA: ${{ needs.source-qualification.outputs.candidate_sha }}
      EXPECTED_TAG_OBJECT_SHA: ${{ needs.source-qualification.outputs.tag_object_sha }}
      PACKAGE_VERSION: ${{ needs.source-qualification.outputs.package_version }}
      DESKTOP_BUILD_LOCK: ${{ matrix.build_lock }}
      SPARKLE_COMMIT: b6496a74a087257ef5e6da1c5b29a447a60f5bd7

    steps:
      # runner.temp is unavailable in job-level env, so resolve the runner-scoped
      # output paths (kept outside the checkout) once here via $RUNNER_TEMP into
      # $GITHUB_ENV; later steps read them as $BUNDLE / ${{ env.BUNDLE }}.
      - name: Resolve runner-scoped output paths
        shell: bash
        run: |
          {
            echo "BUNDLE=$RUNNER_TEMP/opai-desktop-bundle"
            echo "SMOKE_BUNDLE=$RUNNER_TEMP/opai-unsigned-smoke-bundle"
            echo "VERIFY_LOG=$RUNNER_TEMP/opai-unsigned-verification.log"
            echo "TRANSPORT_ARCHIVE=$RUNNER_TEMP/OPai-${RELEASE_TAG}-${{ matrix.os }}-production-input.tar"
          } >> "$GITHUB_ENV"

      - name: Reject invalid channel acknowledgement and untrusted production workflow ref
        shell: bash
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?$ ]]; then
            echo "release_tag must be a safe package-version tag such as v0.2.1a1."
            exit 2
          fi
          if [ "$RELEASE_CHANNEL" = "unsigned-prealpha" ] && [ "$ALLOW_UNSIGNED_PREALPHA" != "true" ]; then
            echo "Explicit allow_unsigned_prealpha acknowledgement is required."
            exit 2
          fi
          if [ "$RELEASE_CHANNEL" = "production" ] && [ "$ALLOW_UNSIGNED_PREALPHA" = "true" ]; then
            echo "A production release cannot opt into unsigned-prealpha mode."
            exit 2
          fi
          if [ "$RELEASE_CHANNEL" = "production" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production signing may be dispatched only from the protected main workflow ref."
            exit 2
          fi

      - name: Check out requested release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove immutable clean annotated tag
        shell: bash
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{tag}")" = "$EXPECTED_TAG_OBJECT_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Create pinned isolated build environment
        shell: bash
        run: |
          test -f "$DESKTOP_BUILD_LOCK" || {
            echo "Missing native build lock for ${{ matrix.os }}: $DESKTOP_BUILD_LOCK"
            echo "Generate and review it on the matching CPython 3.13 platform before release."
            exit 2
          }
          python -m venv .artifact-build-venv
          PY=./.artifact-build-venv/bin/python
          [ -f ./.artifact-build-venv/Scripts/python.exe ] && PY=./.artifact-build-venv/Scripts/python.exe
          # The lock includes pip/setuptools/wheel as well as the native build
          # inputs. Keep isolation disabled so no unpinned build backend is
          # resolved while installing the (sdist-only) Nuitka release.
          "$PY" -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/desktop-build-bootstrap.lock
          "$PY" -m pip install --disable-pip-version-check --require-hashes --no-build-isolation -r "$DESKTOP_BUILD_LOCK"
          "$PY" -m pip install --no-deps -e . --disable-pip-version-check --no-build-isolation
          "$PY" -m pip check
          echo "ARTIFACT_PY=$PY" >> "$GITHUB_ENV"

      - name: Build unsigned portable bundle from the tag
        shell: bash
        run: |
          "$ARTIFACT_PY" scripts/build_desktop_artifacts.py \
            --build-python "$ARTIFACT_PY" \
            --lock-file "$DESKTOP_BUILD_LOCK" \
            --output-dir "$BUNDLE" \
            --channel unsigned-prealpha

      - name: Build pinned Sparkle 2 external-bundle helper from source
        if: env.RELEASE_CHANNEL == 'production' && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          SPARKLE_SOURCE="$RUNNER_TEMP/Sparkle"
          SPARKLE_DERIVED="$RUNNER_TEMP/SparkleDerived"
          git init "$SPARKLE_SOURCE"
          git -C "$SPARKLE_SOURCE" remote add origin https://github.com/sparkle-project/Sparkle.git
          git -C "$SPARKLE_SOURCE" fetch --depth 1 origin "$SPARKLE_COMMIT"
          git -C "$SPARKLE_SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$SPARKLE_SOURCE" rev-parse HEAD)" = "$SPARKLE_COMMIT"
          /usr/bin/xcodebuild -project "$SPARKLE_SOURCE/Sparkle.xcodeproj" \
            -scheme sparkle-cli -configuration Release \
            -derivedDataPath "$SPARKLE_DERIVED" CODE_SIGNING_ALLOWED=NO build
          /usr/bin/xcodebuild -project "$SPARKLE_SOURCE/Sparkle.xcodeproj" \
            -scheme sign_update -configuration Release \
            -derivedDataPath "$SPARKLE_DERIVED" CODE_SIGNING_ALLOWED=NO build
          SPARKLE_APP="$(find "$SPARKLE_DERIVED/Build/Products/Release" -maxdepth 2 -type d -name sparkle.app -print -quit)"
          SIGN_UPDATE="$(find "$SPARKLE_DERIVED/Build/Products/Release" -maxdepth 2 -type f -name sign_update -print -quit)"
          test -n "$SPARKLE_APP"
          test -n "$SIGN_UPDATE"
          mkdir -p "$BUNDLE/support"
          /usr/bin/ditto "$SPARKLE_APP" "$BUNDLE/support/sparkle.app"
          cp "$SIGN_UPDATE" "$BUNDLE/support/sign_update"
          chmod 0755 "$BUNDLE/support/sign_update"

      - name: Create mode-preserving production signing transport
        if: env.RELEASE_CHANNEL == 'production'
        shell: bash
        run: >-
          "$ARTIFACT_PY" scripts/desktop_release_transport.py pack-transport
          --bundle "$BUNDLE" --archive "$TRANSPORT_ARCHIVE"

      - name: Record unsigned alpha verification state
        if: env.RELEASE_CHANNEL == 'unsigned-prealpha'
        shell: bash
        run: |
          printf '%s\n' "unsigned-prealpha: no signing credentials were requested or supplied" > "$VERIFY_LOG"

      - name: Archive unsigned macOS portable artifact
        if: env.RELEASE_CHANNEL == 'unsigned-prealpha' && matrix.os == 'macos-latest'
        shell: bash
        run: |
          ARCHIVE="$RUNNER_TEMP/OPai-${RELEASE_TAG}-macos-latest-unsigned-prealpha.zip"
          /usr/bin/ditto -c -k --keepParent "$BUNDLE" "$ARCHIVE"
          printf 'ARCHIVE=%s\n' "$ARCHIVE" >> "$GITHUB_ENV"

      - name: Archive unsigned Windows portable artifact
        if: env.RELEASE_CHANNEL == 'unsigned-prealpha' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP ("OPai-{0}-windows-latest-unsigned-prealpha.zip" -f $env:RELEASE_TAG)
          Compress-Archive -LiteralPath $env:BUNDLE -DestinationPath $archive -Force
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Clean-extract exact unsigned rehearsal archive
        if: env.RELEASE_CHANNEL == 'unsigned-prealpha'
        shell: bash
        run: |
          test -f "$ARCHIVE"
          "$ARTIFACT_PY" scripts/desktop_release_transport.py extract-signed-zip \
            --archive "$ARCHIVE" --bundle-output "$SMOKE_BUNDLE"
          "$ARTIFACT_PY" scripts/desktop_release_transport.py verify-bundle-identity \
            --bundle "$SMOKE_BUNDLE" --release-tag "$RELEASE_TAG" \
            --candidate-sha "$EXPECTED_CANDIDATE_SHA" --platform "${{ matrix.os }}"

      - name: Smoke exact unsigned rehearsal archive outside checkout
        if: env.RELEASE_CHANNEL == 'unsigned-prealpha'
        shell: bash
        run: |
          "$ARTIFACT_PY" scripts/smoke_desktop_artifacts.py "$SMOKE_BUNDLE" --timeout 120

      - name: Upload unsigned alpha artifact and evidence
        if: env.RELEASE_CHANNEL == 'unsigned-prealpha'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OPai-${{ github.event.inputs.release_tag || github.ref_name }}-${{ matrix.os }}-unsigned-prealpha-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.SMOKE_BUNDLE }}/SHA256SUMS.txt
            ${{ env.SMOKE_BUNDLE }}/provenance.json
            ${{ env.SMOKE_BUNDLE }}/signing-status.json
            ${{ env.VERIFY_LOG }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload production signing input
        if: env.RELEASE_CHANNEL == 'production'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OPai-${{ github.event.inputs.release_tag }}-${{ matrix.os }}-production-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TRANSPORT_ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Protected production signing (${{ matrix.os }})
    needs: [build, source-qualification, web-qualification, provider-qualification]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_channel == 'production' && github.ref == 'refs/heads/main' }}
    environment:
      name: opai-production-signing
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      EXPECTED_CANDIDATE_SHA: ${{ needs.source-qualification.outputs.candidate_sha }}
      EXPECTED_TAG_OBJECT_SHA: ${{ needs.source-qualification.outputs.tag_object_sha }}
      PACKAGE_VERSION: ${{ needs.source-qualification.outputs.package_version }}
      EXPECTED_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.OPAI_WINDOWS_SIGNER_THUMBPRINT }}
      EXPECTED_MACOS_TEAM_ID: ${{ vars.OPAI_MACOS_TEAM_ID }}
      WINDOWS_PACKAGE_IDENTITY: ${{ vars.OPAI_WINDOWS_PACKAGE_IDENTITY }}
      WINDOWS_PUBLISHER_IDENTITY: ${{ vars.OPAI_WINDOWS_PUBLISHER_IDENTITY }}
      MACOS_PACKAGE_IDENTITY: ${{ vars.OPAI_MACOS_PACKAGE_IDENTITY }}
      UPDATE_CHANNEL: ${{ vars.OPAI_UPDATE_CHANNEL }}
      UPDATE_FEED_URL: ${{ vars.OPAI_UPDATE_FEED_URL }}
      UPDATE_TRUST_JSON: ${{ vars.OPAI_UPDATE_TRUST_JSON }}
      SPARKLE_PUBLIC_KEY: ${{ vars.OPAI_SPARKLE_PUBLIC_KEY }}

    steps:
      - name: Check out trusted release tooling from main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # runner.temp is unavailable in job-level env; resolve runner-scoped signing
      # paths here (after checkout so the checkout stays step 0) via $GITHUB_ENV.
      - name: Resolve runner-scoped signing paths
        shell: bash
        run: |
          {
            echo "BUNDLE=$RUNNER_TEMP/opai-desktop-bundle"
            echo "SIGNING_INPUT=$RUNNER_TEMP/opai-production-signing-input"
            echo "VERIFY_LOG=$RUNNER_TEMP/opai-signing-verification.log"
            echo "PUBLISHER_IDENTITY=$RUNNER_TEMP/opai-publisher-identity.json"
            echo "TRUST_FILE=$RUNNER_TEMP/opai-update-trust.json"
            echo "MSIX_LAYOUT=$RUNNER_TEMP/opai-msix-layout"
            echo "NATIVE_OUTPUT=$RUNNER_TEMP/opai-native-output"
          } >> "$GITHUB_ENV"

      - name: Set up trusted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Resolve same-run production signing input by immutable artifact ID
        id: production_input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INVENTORY="$RUNNER_TEMP/opai-production-input-artifacts.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > "$INVENTORY"
          python scripts/desktop_release_transport.py resolve-artifact \
            --inventory "$INVENTORY" \
            --name-prefix "OPai-${RELEASE_TAG}-${{ matrix.os }}-production-input-${GITHUB_RUN_ID}-" \
            --current-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download unsigned production signing input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.production_input.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ env.SIGNING_INPUT }}

      - name: Restore mode-preserving production signing input
        shell: bash
        run: |
          TRANSPORT_ARCHIVE="$SIGNING_INPUT/OPai-${RELEASE_TAG}-${{ matrix.os }}-production-input.tar"
          test -f "$TRANSPORT_ARCHIVE"
          python scripts/desktop_release_transport.py extract-transport \
            --archive "$TRANSPORT_ARCHIVE" --bundle-output "$BUNDLE"

      - name: Independently bind input provenance to the requested immutable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?$ ]]; then
            echo "release_tag must be a safe v-prefixed canonical package version."
            exit 2
          fi
          REMOTE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq 'select(.object.type == "tag") | .object.sha')"
          test "$REMOTE_TAG_OBJECT" = "$EXPECTED_TAG_OBJECT_SHA"
          REMOTE_CANDIDATE="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${REMOTE_TAG_OBJECT}" --jq 'select(.object.type == "commit") | .object.sha')"
          test "$REMOTE_CANDIDATE" = "$EXPECTED_CANDIDATE_SHA"
          git merge-base --is-ancestor "$EXPECTED_CANDIDATE_SHA" "$GITHUB_SHA"
          python scripts/desktop_release_transport.py verify-bundle-identity \
            --bundle "$BUNDLE" --release-tag "$RELEASE_TAG" \
            --candidate-sha "$EXPECTED_CANDIDATE_SHA" --platform "${{ matrix.os }}"

      - name: Embed protected updater trust and native runtime identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPDATE_TRUST_JSON"
          test -n "$UPDATE_FEED_URL"
          test -n "$UPDATE_CHANNEL"
          python - "$TRUST_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          value = json.loads(os.environ["UPDATE_TRUST_JSON"])
          if value.get("feed_url") != os.environ["UPDATE_FEED_URL"]:
              raise SystemExit("protected trust feed does not match protected feed URL")
          Path(sys.argv[1]).write_text(json.dumps(value, sort_keys=True) + "\n", encoding="utf-8")
          PY
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            test -n "$WINDOWS_PACKAGE_IDENTITY"
            test -n "$WINDOWS_PUBLISHER_IDENTITY"
            python scripts/prepare_native_update.py configure \
              --bundle "$BUNDLE" --trust "$TRUST_FILE" --version "$PACKAGE_VERSION" \
              --build-id "$EXPECTED_CANDIDATE_SHA" --channel "$UPDATE_CHANNEL" \
              --platform windows --architecture x86_64 --install-type windows_msix \
              --package-identity "$WINDOWS_PACKAGE_IDENTITY" \
              --publisher-identity "$WINDOWS_PUBLISHER_IDENTITY"
          else
            test -n "$MACOS_PACKAGE_IDENTITY"
            test -n "$EXPECTED_MACOS_TEAM_ID"
            test -n "$SPARKLE_PUBLIC_KEY"
            test -d "$BUNDLE/support/sparkle.app"
            ARCHITECTURE="$(uname -m)"
            [ "$ARCHITECTURE" = "x86_64" ] || [ "$ARCHITECTURE" = "arm64" ]
            python scripts/prepare_native_update.py macos-sparkle \
              --bundle "$BUNDLE" --sparkle-app "$BUNDLE/support/sparkle.app" \
              --version "$PACKAGE_VERSION" --feed-url "$UPDATE_FEED_URL" \
              --sparkle-public-key "$SPARKLE_PUBLIC_KEY"
            python scripts/prepare_native_update.py configure \
              --bundle "$BUNDLE" --trust "$TRUST_FILE" --version "$PACKAGE_VERSION" \
              --build-id "$EXPECTED_CANDIDATE_SHA" --channel "$UPDATE_CHANNEL" \
              --platform macos --architecture "$ARCHITECTURE" --install-type macos_sparkle \
              --package-identity "$MACOS_PACKAGE_IDENTITY" \
              --publisher-identity "$EXPECTED_MACOS_TEAM_ID"
          fi

      - name: Sign and verify Windows production bundle
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.OPAI_WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.OPAI_WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_PFX_BASE64 -or -not $env:WINDOWS_PFX_PASSWORD) { throw "Windows signing secrets are required for production." }
          $expectedThumbprint = ($env:EXPECTED_WINDOWS_SIGNER_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($expectedThumbprint -notmatch '^[0-9A-F]{40}$') { throw "A protected Windows signer thumbprint is required for production." }
          $signTool = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin\x64\signtool.exe"
          if (-not (Test-Path -LiteralPath $signTool -PathType Leaf)) { throw "Trusted signtool.exe was not found at $signTool" }
          $certificate = Join-Path $env:RUNNER_TEMP "opai-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            $log = @()
            Get-ChildItem -Path $env:BUNDLE -Recurse -File | Where-Object { $_.Extension -in ".exe", ".dll", ".pyd" } | ForEach-Object {
              & $signTool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_PFX_PASSWORD $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.FullName)" }
              $signature = Get-AuthenticodeSignature -FilePath $_.FullName
              if ($signature.Status -ne 'Valid') { throw "Authenticode verification failed for $($_.FullName): $($signature.Status)" }
              $thumbprint = ($signature.SignerCertificate.Thumbprint -replace '\s', '').ToUpperInvariant()
              if ($thumbprint -ne $expectedThumbprint) { throw "Authenticode publisher did not match the protected signer thumbprint for $($_.FullName)" }
              if ($signature.SignerCertificate.Subject -ne $env:WINDOWS_PUBLISHER_IDENTITY) { throw "Authenticode subject did not match the protected MSIX publisher identity for $($_.FullName)" }
              $log += $signature
            }
            if ($log.Count -eq 0) { throw "No Windows executable code files were signed." }
            $log | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $env:VERIFY_LOG -Encoding utf8
          }
          finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }

      - name: Sign, notarize, and verify macOS production bundle
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.OPAI_APPLE_DEVELOPER_ID }}
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.OPAI_APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.OPAI_APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.OPAI_APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.OPAI_APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.OPAI_APPLE_NOTARY_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.OPAI_MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_DEVELOPER_ID"
          test -n "$APPLE_SIGNING_CERTIFICATE_BASE64"
          test -n "$APPLE_SIGNING_CERTIFICATE_PASSWORD"
          test -n "$APPLE_NOTARY_APPLE_ID"
          test -n "$APPLE_NOTARY_TEAM_ID"
          test -n "$APPLE_NOTARY_APP_SPECIFIC_PASSWORD"
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$APPLE_NOTARY_TEAM_ID" == "$APPLE_TEAM_ID" ]]
          KEYCHAIN="$RUNNER_TEMP/opai-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/opai-signing.p12"
          KEYCHAIN_PASSWORD="$(/usr/bin/uuidgen)"
          NOTARY_PROFILE="opai-notary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            /usr/bin/security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            /bin/rm -f "$CERTIFICATE"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_SIGNING_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE"
          /usr/bin/security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          /usr/bin/security set-keychain-settings -lut 21600 "$KEYCHAIN"
          /usr/bin/security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          /usr/bin/security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          /usr/bin/security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          /usr/bin/xcrun notarytool store-credentials "$NOTARY_PROFILE" --apple-id "$APPLE_NOTARY_APPLE_ID" --team-id "$APPLE_NOTARY_TEAM_ID" --password "$APPLE_NOTARY_APP_SPECIFIC_PASSWORD" --keychain "$KEYCHAIN"
          APP="$BUNDLE/gui/OPai.app"
          CLI="$BUNDLE/cli/opai"
          test -d "$APP"
          test -f "$CLI"
          /usr/bin/codesign --force --deep --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$APPLE_DEVELOPER_ID" "$APP"
          /usr/bin/codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$APPLE_DEVELOPER_ID" "$CLI"
          /usr/bin/ditto -c -k --keepParent "$BUNDLE" "$RUNNER_TEMP/opai-notary-input.zip"
          /usr/bin/xcrun notarytool submit "$RUNNER_TEMP/opai-notary-input.zip" --keychain-profile "$NOTARY_PROFILE" --keychain "$KEYCHAIN" --wait
          /usr/bin/xcrun stapler staple "$APP"
          {
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
            /usr/bin/codesign --verify --strict --verbose=2 "$CLI"
            /usr/sbin/spctl --assess --type execute --verbose=4 "$APP"
            /usr/sbin/spctl --assess --type execute --verbose=4 "$CLI"
            /usr/bin/codesign -d --verbose=4 "$APP" 2>&1 | /usr/bin/grep -F "TeamIdentifier=$APPLE_TEAM_ID"
            /usr/bin/codesign -d --verbose=4 "$CLI" 2>&1 | /usr/bin/grep -F "TeamIdentifier=$APPLE_TEAM_ID"
            /usr/bin/xcrun stapler validate "$APP"
          } 2>&1 | /usr/bin/tee "$VERIFY_LOG"

      - name: Finalize production evidence after platform verification
        shell: bash
        run: |
          STATUS=signed
          TOOL=Authenticode
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            STATUS=signed-and-notarized
            TOOL=codesign+spctl+notarytool+stapler
          fi
          python scripts/finalize_desktop_artifact.py "$BUNDLE" \
            --verification-log "$VERIFY_LOG" \
            --tool "$TOOL" \
            --status "$STATUS"

      - name: Create and sign final Windows MSIX package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.OPAI_WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.OPAI_WINDOWS_PFX_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path $env:NATIVE_OUTPUT -Force | Out-Null
          $assets = Join-Path $env:RUNNER_TEMP "opai-msix-assets"
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Image]::FromFile((Resolve-Path "opai/assets/opai-icon.png"))
          try {
            $sizes = @{
              "StoreLogo.png" = @(50, 50)
              "Square150x150Logo.png" = @(150, 150)
              "Square44x44Logo.png" = @(44, 44)
              "Wide310x150Logo.png" = @(310, 150)
            }
            foreach ($entry in $sizes.GetEnumerator()) {
              $bitmap = New-Object System.Drawing.Bitmap($entry.Value[0], $entry.Value[1])
              try {
                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                try { $graphics.DrawImage($source, 0, 0, $entry.Value[0], $entry.Value[1]) }
                finally { $graphics.Dispose() }
                $bitmap.Save((Join-Path $assets $entry.Key), [System.Drawing.Imaging.ImageFormat]::Png)
              }
              finally { $bitmap.Dispose() }
            }
          }
          finally { $source.Dispose() }
          python scripts/prepare_native_update.py windows-layout \
            --bundle $env:BUNDLE --layout $env:MSIX_LAYOUT --assets $assets \
            --version $env:PACKAGE_VERSION --architecture x86_64 \
            --package-identity $env:WINDOWS_PACKAGE_IDENTITY \
            --publisher-identity $env:WINDOWS_PUBLISHER_IDENTITY
          $makeAppx = Get-ChildItem -LiteralPath (Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin") -Filter makeappx.exe -Recurse -File |
            Where-Object { $_.DirectoryName -match '[\\/]x64$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          $signTool = Get-ChildItem -LiteralPath (Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin") -Filter signtool.exe -Recurse -File |
            Where-Object { $_.DirectoryName -match '[\\/]x64$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeAppx -or -not $signTool) { throw "Windows SDK packaging tools are unavailable." }
          $native = Join-Path $env:NATIVE_OUTPUT ("OPai-{0}-windows-x64.msix" -f $env:RELEASE_TAG)
          python scripts/prepare_native_update.py make-msix --layout $env:MSIX_LAYOUT --output $native --makeappx $makeAppx.FullName
          $certificate = Join-Path $env:RUNNER_TEMP "opai-msix-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_PFX_PASSWORD $native
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for final MSIX" }
            & $signTool.FullName verify /pa /all /v $native
            if ($LASTEXITCODE -ne 0) { throw "final MSIX signature verification failed" }
            $signature = Get-AuthenticodeSignature -LiteralPath $native
            $thumbprint = ($signature.SignerCertificate.Thumbprint -replace '\s', '').ToUpperInvariant()
            $expectedThumbprint = ($env:EXPECTED_WINDOWS_SIGNER_THUMBPRINT -replace '\s', '').ToUpperInvariant()
            if ($signature.Status -ne 'Valid' -or $thumbprint -ne $expectedThumbprint -or $signature.SignerCertificate.Subject -ne $env:WINDOWS_PUBLISHER_IDENTITY) {
              throw "final MSIX publisher identity did not match protected release policy"
            }
          }
          finally { Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue }
          "NATIVE_PACKAGE=$native" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create and Sparkle-sign final notarized macOS archive
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.OPAI_SPARKLE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY_BASE64"
          mkdir -p "$NATIVE_OUTPUT"
          NATIVE_PACKAGE="$NATIVE_OUTPUT/OPai-${RELEASE_TAG}-macos.zip"
          /usr/bin/ditto -c -k --keepParent --sequesterRsrc "$BUNDLE/gui/OPai.app" "$NATIVE_PACKAGE"
          SPARKLE_KEY="$RUNNER_TEMP/opai-sparkle-private-key"
          cleanup_sparkle_key() { /bin/rm -f "$SPARKLE_KEY"; }
          trap cleanup_sparkle_key EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$SPARKLE_KEY"
          SIGNATURE_FRAGMENT="$($BUNDLE/support/sign_update --ed-key-file "$SPARKLE_KEY" "$NATIVE_PACKAGE")"
          python - "$SIGNATURE_FRAGMENT" "$NATIVE_OUTPUT/sparkle-signature.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          fragment, output = sys.argv[1:]
          signature = re.search(r'sparkle:edSignature="([A-Za-z0-9+/=]+)"', fragment)
          length = re.search(r'length="([0-9]+)"', fragment)
          if not signature or not length:
              raise SystemExit("Sparkle sign_update returned an invalid signature fragment")
          Path(output).write_text(json.dumps({"sparkle_ed_signature": signature.group(1), "length": int(length.group(1))}, sort_keys=True) + "\n", encoding="utf-8")
          PY
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["length"])' "$NATIVE_OUTPUT/sparkle-signature.json")" = "$(stat -f%z "$NATIVE_PACKAGE")"
          printf 'NATIVE_PACKAGE=%s\n' "$NATIVE_PACKAGE" >> "$GITHUB_ENV"

      - name: Record validated publisher identity for credential-free smoke
        shell: bash
        run: |
          python - "$PUBLISHER_IDENTITY" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          runner_os = os.environ["RUNNER_OS"]
          if runner_os == "Windows":
              thumbprint = re.sub(
                  r"\s+", "", os.environ["EXPECTED_WINDOWS_SIGNER_THUMBPRINT"]
              ).upper()
              if not re.fullmatch(r"[0-9A-F]{40}", thumbprint):
                  raise SystemExit("validated Windows signer thumbprint is missing")
              value = {
                  "platform": "windows",
                  "windows_signer_thumbprint": thumbprint,
              }
          elif runner_os == "macOS":
              team_id = os.environ["EXPECTED_MACOS_TEAM_ID"].upper()
              if not re.fullmatch(r"[A-Z0-9]{10}", team_id):
                  raise SystemExit("validated macOS Team ID is missing")
              value = {"macos_team_id": team_id, "platform": "macos"}
          else:
              raise SystemExit(f"unsupported signing runner: {runner_os}")
          value.update(
              {
                  "candidate_sha": os.environ["EXPECTED_CANDIDATE_SHA"],
                  "release_tag": os.environ["RELEASE_TAG"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "tag_object_sha": os.environ["EXPECTED_TAG_OBJECT_SHA"],
              }
          )
          output.write_text(json.dumps(value, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Archive signed macOS portable artifact before any artifact execution
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          ARCHIVE="$RUNNER_TEMP/OPai-${RELEASE_TAG}-macos-latest-production.zip"
          /usr/bin/ditto -c -k --keepParent "$BUNDLE" "$ARCHIVE"
          printf 'ARCHIVE=%s\n' "$ARCHIVE" >> "$GITHUB_ENV"

      - name: Archive signed Windows portable artifact before any artifact execution
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP ("OPai-{0}-windows-latest-production.zip" -f $env:RELEASE_TAG)
          Compress-Archive -LiteralPath $env:BUNDLE -DestinationPath $archive -Force
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload immutable signed production output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OPai-${{ github.event.inputs.release_tag }}-${{ matrix.os }}-production-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.NATIVE_PACKAGE }}
            ${{ env.NATIVE_OUTPUT }}/sparkle-signature.json
            ${{ env.VERIFY_LOG }}
            ${{ env.PUBLISHER_IDENTITY }}
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: Credential-free signed artifact smoke (${{ matrix.os }})
    needs: [source-qualification, sign]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_channel == 'production' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      EXPECTED_CANDIDATE_SHA: ${{ needs.source-qualification.outputs.candidate_sha }}
      EXPECTED_TAG_OBJECT_SHA: ${{ needs.source-qualification.outputs.tag_object_sha }}

    steps:
      - name: Check out trusted smoke tooling from main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # runner.temp is unavailable in job-level env; resolve runner-scoped smoke
      # paths here (after checkout) via $GITHUB_ENV.
      - name: Resolve runner-scoped smoke paths
        shell: bash
        run: |
          {
            echo "SIGNED_OUTPUT=$RUNNER_TEMP/opai-signed-output"
            echo "BUNDLE=$RUNNER_TEMP/opai-desktop-bundle"
            echo "RAW_SMOKE_REPORT=$RUNNER_TEMP/opai-raw-smoke-report.json"
            echo "SMOKE_REPORT=$RUNNER_TEMP/opai-smoke-report.json"
          } >> "$GITHUB_ENV"

      - name: Set up trusted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Resolve same-run signed archive by immutable artifact ID
        id: signed_artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INVENTORY="$RUNNER_TEMP/opai-signed-artifacts.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > "$INVENTORY"
          python scripts/desktop_release_transport.py resolve-artifact \
            --inventory "$INVENTORY" \
            --name-prefix "OPai-${RELEASE_TAG}-${{ matrix.os }}-production-signed-${GITHUB_RUN_ID}-" \
            --current-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download immutable signed production output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.signed_artifact.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ env.SIGNED_OUTPUT }}

      - name: Clean-extract the exact signed archive outside the checkout
        shell: bash
        run: |
          ARCHIVE="$SIGNED_OUTPUT/OPai-${RELEASE_TAG}-${{ matrix.os }}-production.zip"
          PUBLISHER_IDENTITY="$(find "$SIGNED_OUTPUT" -type f -name opai-publisher-identity.json -print -quit)"
          test -f "$ARCHIVE"
          test -n "$PUBLISHER_IDENTITY"
          python scripts/desktop_release_transport.py extract-signed-zip \
            --archive "$ARCHIVE" --bundle-output "$BUNDLE"
          python scripts/desktop_release_transport.py verify-bundle-identity \
            --bundle "$BUNDLE" --release-tag "$RELEASE_TAG" \
            --candidate-sha "$EXPECTED_CANDIDATE_SHA" --platform "${{ matrix.os }}"
          printf 'ARCHIVE=%s\n' "$ARCHIVE" >> "$GITHUB_ENV"
          printf 'PUBLISHER_IDENTITY=%s\n' "$PUBLISHER_IDENTITY" >> "$GITHUB_ENV"

      - name: Read validated publisher identity from signed output
        shell: bash
        run: |
          python - "$PUBLISHER_IDENTITY" "${{ matrix.os }}" "$GITHUB_ENV" \
            "$EXPECTED_CANDIDATE_SHA" "$EXPECTED_TAG_OBJECT_SHA" "$RELEASE_TAG" \
            "$GITHUB_RUN_ID" "${{ steps.signed_artifact.outputs.producer_attempt }}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          (
              identity_path,
              matrix_os,
              environment_path,
              candidate_sha,
              tag_object_sha,
              release_tag,
              run_id,
              producer_attempt,
          ) = map(str, sys.argv[1:])
          value = json.loads(Path(identity_path).read_text(encoding="utf-8"))
          expected_common = {
              "candidate_sha": candidate_sha,
              "release_tag": release_tag,
              "run_attempt": producer_attempt,
              "run_id": run_id,
              "tag_object_sha": tag_object_sha,
          }
          if any(value.get(key) != expected for key, expected in expected_common.items()):
              raise SystemExit("signed output publisher identity does not match this release")
          if matrix_os == "windows-latest":
              thumbprint = str(value.get("windows_signer_thumbprint", "")).upper()
              if value.get("platform") != "windows" or not re.fullmatch(
                  r"[0-9A-F]{40}", thumbprint
              ):
                  raise SystemExit("signed output has no valid Windows signer identity")
              line = f"WINDOWS_SIGNER_THUMBPRINT={thumbprint}\n"
          elif matrix_os == "macos-latest":
              team_id = str(value.get("macos_team_id", "")).upper()
              if value.get("platform") != "macos" or not re.fullmatch(
                  r"[A-Z0-9]{10}", team_id
              ):
                  raise SystemExit("signed output has no valid macOS Team ID")
              line = f"MACOS_TEAM_ID={team_id}\n"
          else:
              raise SystemExit(f"unsupported smoke runner: {matrix_os}")
          with Path(environment_path).open("a", encoding="utf-8") as environment:
              environment.write(line)
          PY

      - name: Smoke signed native artifact outside checkout without release credentials
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            python scripts/smoke_desktop_artifacts.py "$BUNDLE" --timeout 120 \
              --windows-signer-thumbprint "$WINDOWS_SIGNER_THUMBPRINT" | tee "$RAW_SMOKE_REPORT"
          else
            python scripts/smoke_desktop_artifacts.py "$BUNDLE" --timeout 120 \
              --macos-team-id "$MACOS_TEAM_ID" | tee "$RAW_SMOKE_REPORT"
          fi

      - name: Bind smoke evidence to exact archive and release identity
        shell: bash
        run: >-
          python scripts/desktop_release_transport.py bind-smoke-evidence
          --raw-report "$RAW_SMOKE_REPORT" --archive "$ARCHIVE" --output "$SMOKE_REPORT"
          --release-tag "$RELEASE_TAG" --candidate-sha "$EXPECTED_CANDIDATE_SHA"
          --tag-object-sha "$EXPECTED_TAG_OBJECT_SHA" --platform "${{ matrix.os }}"
          --run-id "$GITHUB_RUN_ID"
          --signed-artifact-id "${{ steps.signed_artifact.outputs.artifact_id }}"
          --signed-artifact-name "${{ steps.signed_artifact.outputs.artifact_name }}"
          --signed-artifact-attempt "${{ steps.signed_artifact.outputs.producer_attempt }}"
          --smoke-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload credential-free smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OPai-${{ github.event.inputs.release_tag }}-${{ matrix.os }}-production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SMOKE_REPORT }}
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest immutable signed production archive (${{ matrix.os }})
    needs: [source-qualification, sign, smoke]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_channel == 'production' && github.ref == 'refs/heads/main' }}
    environment:
      name: opai-production-signing
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      EXPECTED_CANDIDATE_SHA: ${{ needs.source-qualification.outputs.candidate_sha }}
      EXPECTED_TAG_OBJECT_SHA: ${{ needs.source-qualification.outputs.tag_object_sha }}

    steps:
      - name: Check out trusted attestation tooling from main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # runner.temp is unavailable in job-level env, so resolve runner-scoped
      # paths via $GITHUB_ENV before they are used.
      - name: Resolve runner-scoped attestation paths
        shell: bash
        run: |
          {
            echo "SIGNED_OUTPUT=$RUNNER_TEMP/opai-signed-output"
            echo "SMOKE_OUTPUT=$RUNNER_TEMP/opai-smoke-output"
            echo "BUNDLE=$RUNNER_TEMP/opai-desktop-bundle"
          } >> "$GITHUB_ENV"

      - name: Set up trusted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Resolve same-run signed archive by immutable artifact ID
        id: signed_artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INVENTORY="$RUNNER_TEMP/opai-signed-artifacts.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > "$INVENTORY"
          python scripts/desktop_release_transport.py resolve-artifact \
            --inventory "$INVENTORY" \
            --name-prefix "OPai-${RELEASE_TAG}-${{ matrix.os }}-production-signed-${GITHUB_RUN_ID}-" \
            --current-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve same-run smoke evidence by immutable artifact ID
        id: smoke_artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INVENTORY="$RUNNER_TEMP/opai-smoke-artifacts.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > "$INVENTORY"
          python scripts/desktop_release_transport.py resolve-artifact \
            --inventory "$INVENTORY" \
            --name-prefix "OPai-${RELEASE_TAG}-${{ matrix.os }}-production-smoke-${GITHUB_RUN_ID}-" \
            --current-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download immutable signed production output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.signed_artifact.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ env.SIGNED_OUTPUT }}

      - name: Download credential-free smoke report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.smoke_artifact.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ env.SMOKE_OUTPUT }}

      - name: Verify exact archive, smoke binding, and collect release evidence
        shell: bash
        run: |
          ARCHIVE="$SIGNED_OUTPUT/OPai-${RELEASE_TAG}-${{ matrix.os }}-production.zip"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            NATIVE_PACKAGE="$SIGNED_OUTPUT/OPai-${RELEASE_TAG}-windows-x64.msix"
          else
            NATIVE_PACKAGE="$SIGNED_OUTPUT/OPai-${RELEASE_TAG}-macos.zip"
          fi
          SIGNING_LOG="$SIGNED_OUTPUT/opai-signing-verification.log"
          PUBLISHER_IDENTITY="$SIGNED_OUTPUT/opai-publisher-identity.json"
          SMOKE_REPORT="$SMOKE_OUTPUT/opai-smoke-report.json"
          test -f "$ARCHIVE"
          test -f "$NATIVE_PACKAGE"
          test -f "$SIGNING_LOG"
          test -f "$PUBLISHER_IDENTITY"
          test -f "$SMOKE_REPORT"
          python scripts/desktop_release_transport.py extract-signed-zip \
            --archive "$ARCHIVE" --bundle-output "$BUNDLE"
          python scripts/desktop_release_transport.py verify-bundle-identity \
            --bundle "$BUNDLE" --release-tag "$RELEASE_TAG" \
            --candidate-sha "$EXPECTED_CANDIDATE_SHA" --platform "${{ matrix.os }}"
          python scripts/desktop_release_transport.py verify-smoke-evidence \
            --evidence "$SMOKE_REPORT" --archive "$ARCHIVE" \
            --release-tag "$RELEASE_TAG" --candidate-sha "$EXPECTED_CANDIDATE_SHA" \
            --tag-object-sha "$EXPECTED_TAG_OBJECT_SHA" --platform "${{ matrix.os }}" \
            --run-id "$GITHUB_RUN_ID" \
            --signed-artifact-id "${{ steps.signed_artifact.outputs.artifact_id }}" \
            --signed-artifact-name "${{ steps.signed_artifact.outputs.artifact_name }}" \
            --signed-artifact-attempt "${{ steps.signed_artifact.outputs.producer_attempt }}" \
            --smoke-attempt "${{ steps.smoke_artifact.outputs.producer_attempt }}"
          EVIDENCE="$RUNNER_TEMP/opai-release-evidence"
          mkdir -p "$EVIDENCE"
          cp "$ARCHIVE" "$EVIDENCE/"
          cp "$NATIVE_PACKAGE" "$EVIDENCE/"
          cp "$BUNDLE/SHA256SUMS.txt" "$EVIDENCE/"
          cp "$BUNDLE/provenance.json" "$EVIDENCE/"
          cp "$BUNDLE/signing-status.json" "$EVIDENCE/"
          cp "$SIGNING_LOG" "$EVIDENCE/"
          cp "$PUBLISHER_IDENTITY" "$EVIDENCE/"
          cp "$SMOKE_REPORT" "$EVIDENCE/"
          printf 'ARCHIVE=%s\n' "$ARCHIVE" >> "$GITHUB_ENV"
          printf 'NATIVE_PACKAGE=%s\n' "$NATIVE_PACKAGE" >> "$GITHUB_ENV"
          printf 'RELEASE_EVIDENCE=%s\n' "$EVIDENCE" >> "$GITHUB_ENV"

      - name: Revalidate immutable remote tag at final attestation boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq 'select(.object.type == "tag") | .object.sha')"
          test "$REMOTE_TAG_OBJECT" = "$EXPECTED_TAG_OBJECT_SHA"
          REMOTE_CANDIDATE="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${REMOTE_TAG_OBJECT}" --jq 'select(.object.type == "commit") | .object.sha')"
          test "$REMOTE_CANDIDATE" = "$EXPECTED_CANDIDATE_SHA"

      # This staging artifact is deliberately not a publication claim. It is
      # consumable as release evidence only when the entire attestation job is green.
      - name: Stage non-publishable immutable production evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OPai-${{ github.event.inputs.release_tag }}-${{ matrix.os }}-production-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30

      - name: Revalidate immutable remote tag immediately before attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq 'select(.object.type == "tag") | .object.sha')"
          test "$REMOTE_TAG_OBJECT" = "$EXPECTED_TAG_OBJECT_SHA"
          REMOTE_CANDIDATE="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${REMOTE_TAG_OBJECT}" --jq 'select(.object.type == "commit") | .object.sha')"
          test "$REMOTE_CANDIDATE" = "$EXPECTED_CANDIDATE_SHA"

      - name: Attest signed production archive after immutable staging upload
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: |
            ${{ env.ARCHIVE }}
            ${{ env.NATIVE_PACKAGE }}

  publish-packaged-update:
    name: Qualify and publish signed packaged update
    needs: [source-qualification, attest]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_channel == 'production' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      attestations: read
      contents: write
    uses: ./.github/workflows/publish-packaged-update.yml
    with:
      release_tag: ${{ github.event.inputs.release_tag }}
      package_version: ${{ needs.source-qualification.outputs.package_version }}
      candidate_sha: ${{ needs.source-qualification.outputs.candidate_sha }}
    secrets: inherit
