name: Release source preflight (exact candidate)

on:
  workflow_dispatch:
  push:
    branches: ["release/**", "rc/**"]

permissions:
  contents: read

concurrency:
  group: opai-release-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: RC source preflight - exact candidate and typed evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate with release history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Set up Node.js for the mandatory local gate
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned release-preflight dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Run strict exact-SHA release preflight
        run: >-
          python -m opai release preflight
          --qualification-required
          --source-only
          --candidate-sha "${{ github.sha }}"
          --run-tests
          --format markdown
          --out source-preflight-evidence.json

      - name: Prove dry-run isolation
        if: always()
        run: python -m opai release dry-run-proof > dry-run-proof.json

      - name: Upload immutable source-preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-source-preflight-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            source-preflight-evidence.json
            dry-run-proof.json
          if-no-files-found: error
          retention-days: 30
