[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opai"
version = "0.1.1"
description = "OPai pre-alpha: local-first AI coding hub with cost-aware routing, MCP-ready registries, and safe project workflows."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
terminal-ui = ["Pillow>=10"]

[project.scripts]
opai = "opai.cli:main"
op = "opai.cli:main"
op-hub = "opaihub.cli:main"
opcoding = "opcoding.cli:main"

[project.urls]
Homepage = "https://github.com/MarcoLadeira/OPai"
Documentation = "https://github.com/MarcoLadeira/OPai/blob/main/hub/docs/OP_AI_HUB_OVERVIEW.md"
Issues = "https://github.com/MarcoLadeira/OPai/issues"
Discussions = "https://github.com/MarcoLadeira/OPai/discussions"
Changelog = "https://github.com/MarcoLadeira/OPai/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["opai", "opai.*", "opaihub", "opaihub.*", "opcoding", "opcoding.*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
opai = ["assets/*"]
opaihub = ["data/hub/**/*"]

[tool.opai]
brand = "OPai"
release = "0.1.1-pre-alpha"
default_mode = "local-first"

[tool.opcoding]
phase = "legacy-compatible"
