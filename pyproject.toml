[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opai"
version = "0.2.1a1"
description = "OPai alpha: the local-first AI coding cost firewall for routing, benchmarks, governance, and safe project workflows."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
desktop-gui = ["PySide6>=6.7", "keyring==25.7.0"]
terminal-ui = ["Pillow>=10"]
test = ["hypothesis==6.160.0"]

[project.scripts]
opai = "opai.cli:main"
op = "opai.cli:main"
op-hub = "opaihub.cli:main"
opcoding = "opcoding.cli:main"

# Windowed launcher: on Windows, pip builds a GUI (pythonw-backed) executable
# from a gui_scripts entry point, so a Start-menu/taskbar shortcut opens the app
# with no attached console window (#148). `opai gui` from a terminal still works.
[project.gui-scripts]
opai-gui = "opai.cli:gui_main"

[project.urls]
Homepage = "https://github.com/MarcoLadeira/OPai"
Documentation = "https://github.com/MarcoLadeira/OPai/blob/main/hub/docs/OP_AI_HUB_OVERVIEW.md"
Issues = "https://github.com/MarcoLadeira/OPai/issues"
Discussions = "https://github.com/MarcoLadeira/OPai/discussions"
Changelog = "https://github.com/MarcoLadeira/OPai/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["opai", "opai.*", "opaihub", "opaihub.*", "opcoding", "opcoding.*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
# package-data globs do not recurse: every asset subfolder needs its own entry.
# assets/web/* is the entire web GUI (issue #139) — extension globs keep the
# __tests__/ subfolder out of the wheel.
opai = [
    "assets/*",
    "assets/fonts/*",
    "assets/web/*.html",
    "assets/web/*.js",
    "assets/web/*.css",
    "assets/web/icons/*.png",
]
opaihub = [
    "data/hub/**/*",
    "data/provider_catalog/*.json",
    # Wildcards do not match dotfiles; parity fixtures require these manifests.
    "data/hub/benchmarks/parity/*/repo/.opai-app.json",
]

[tool.opai]
brand = "OPai"
release = "0.2.0-alpha.2"
default_mode = "local-first"

[tool.opcoding]
phase = "legacy-compatible"

[tool.pytest.ini_options]
filterwarnings = ["error::pytest.PytestCollectionWarning"]
testpaths = ["tests"]
