[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vesta"
version = "0.2.1a1"
description = "Vesta alpha: the local-first AI coding cost firewall for routing, benchmarks, governance, and safe project workflows."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0.2,<7",
    "cryptography>=50.0.0,<51",
    "packaging>=25,<27",
]

[project.optional-dependencies]
desktop-gui = ["PySide6>=6.7", "keyring==25.7.0"]
terminal-ui = ["Pillow>=10"]
test = ["hypothesis==6.160.0", "pytest==9.0.3"]

[project.scripts]
vesta = "vesta.bootstrap:cli_main"
op = "vesta.bootstrap:cli_main"
op-hub = "vestahub.cli:main"
opcoding = "opcoding.cli:main"

# Windowed launcher: on Windows, pip builds a GUI (pythonw-backed) executable
# from a gui_scripts entry point, so a Start-menu/taskbar shortcut opens the app
# with no attached console window (#148). `vesta gui` from a terminal still works.
#
# The name is what Task Manager shows -- for the launcher, and only for the
# launcher. That distinction is written out because this comment used to claim
# more than was true. Measured: Vesta-Desktop.exe starts and *stays* as the
# parent, spawns C:\Python313\pythonw.exe as a child, and the child owns the
# window -- so Task Manager still describes the window's process as "Python"
# (pythonw.exe carries FileDescription "Python"). What the entry point does buy
# is a recognisable parent in the process tree, plus -- via the AppUserModelID
# set in vesta/gui_identity.py -- the Vesta icon in the taskbar and Alt-Tab.
# Renaming the window's own process needs a bundled launcher Vesta does not ship.
#
# It cannot be plain `Vesta`: Windows filenames are case-insensitive, so
# `Vesta.exe` and the `vesta` console script's `vesta.exe` are the same file and
# one would overwrite the other.
#
# Installing Vesta must use a *console* interpreter. pip derives a gui_scripts
# launcher from sys.executable by replacing "python" with "pythonw", so an
# install run from a pythonw process writes "pythonww.exe" into these two
# launchers and the desktop icon silently stops working. See
# vestahub.proc.console_interpreter, which is what the updater now installs with.
[project.gui-scripts]
vesta-gui = "vesta.bootstrap:desktop_main"
Vesta-Desktop = "vesta.bootstrap:desktop_main"

[project.urls]
Homepage = "https://github.com/MarcoLadeira/Vesta"
Documentation = "https://github.com/MarcoLadeira/Vesta/blob/main/hub/docs/OP_AI_HUB_OVERVIEW.md"
Issues = "https://github.com/MarcoLadeira/Vesta/issues"
Discussions = "https://github.com/MarcoLadeira/Vesta/discussions"
Changelog = "https://github.com/MarcoLadeira/Vesta/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["vesta", "vesta.*", "vestahub", "vestahub.*", "opcoding", "opcoding.*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
# package-data globs do not recurse: every asset subfolder needs its own entry.
# assets/web/* is the entire web GUI (issue #139) — extension globs keep the
# __tests__/ subfolder out of the wheel.
vesta = [
    "_embedded_build.json",
    "update/*.json",
    "assets/*",
    "assets/fonts/*",
    "assets/web/*.html",
    "assets/web/*.js",
    "assets/web/*.css",
    "assets/web/icons/*.png",
    "assets/web/vendor/*.js",
    "assets/web/vendor/*.txt",
]
vestahub = [
    "data/hub/**/*",
    "data/provider_catalog/*.json",
    # The generated cross-language lifecycle fixture (#612) — packaging must
    # ship it or a packaged install silently falls back to nothing, rather
    # than to a hardcoded graph, per its own startup-failure contract.
    "data/lifecycle-fixtures.json",
    # The tool capability registry (#569). Without it a packaged install cannot
    # tell that a capability is known-degraded, so it rediscovers upstream
    # breakage the expensive way — a failed command and a burnt provider turn.
    "data/tool_capabilities.yaml",
    # Wildcards do not match dotfiles; parity fixtures require these manifests.
    "data/hub/benchmarks/parity/*/repo/.vesta-app.json",
]

[tool.ruff]
# vestahub/generated_lifecycle.py is generated by scripts/generate_lifecycle.py
# from vestahub/lifecycle_schema.json via pprint.pformat, which does not always
# agree with ruff's own formatting opinion. `generate_lifecycle.py --check`
# is that file's actual source of truth; excluding it here stops the two
# checks from fighting over its style.
extend-exclude = ["vestahub/generated_lifecycle.py"]

[tool.vesta]
brand = "Vesta"
default_mode = "local-first"

[tool.opcoding]
phase = "legacy-compatible"

[tool.pytest.ini_options]
filterwarnings = ["error::pytest.PytestCollectionWarning"]
testpaths = ["tests"]
